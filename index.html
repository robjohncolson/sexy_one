<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SXC-1 Trainer</title>
<style>
  /*
   * All visual styling for the SXC-1 Trainer lives here. The Haskell/Miso
   * application (compiled to WebAssembly) contributes markup only, mounted
   * by APPENDING <main id="app"> to <body> at runtime -- static body markup
   * (#boot-status, <noscript>) survives beside it. Before boot completes,
   * #boot-status is the only visible content.
   *
   * M1 DOM contract this file styles (identical on every route):
   *   #app > #sxc1-header        brand link (a.brand) + a route-dependent
   *                               breadcrumb
   *   #app > #sxc1-content-stats always [hidden]; never rendered visibly
   *   #app > ... one of:
   *     #sxc1-home                  ul.manual-list > li > a.manual-card
   *     #sxc1-toc                   section.toc-group > h2.toc-group-title
   *                                  + ol.toc-sections > li > a + span.toc-page
   *                                  (+ ul.toc-subs > li > a)
   *     #sxc1-page                  (+ class "ja-visible" when JA is shown)
   *                                  p.page-running-header?
   *                                  div.page-body#page-<n>
   *                                    figure.md-figure > figcaption
   *                                    blockquote.md-note
   *                                    div.table-wrap > table
   *                                    span.md-placeholder, code, a.page-ref
   *                                    ol[start], nested ul/ol
   *                                  figure#ja-panel > img#ja-image + figcaption?
   *                                  button#btn-ja-toggle
   *                                  nav.page-nav > a#btn-prev-page, a#btn-next-page
   *   #app > #sxc1-footer         p#sxc1-disclaimer
   *
   * Headings rendered inside a page carry id="h-<slug>" (styled generically
   * via .page-body h1..h6, no dedicated hook needed).
   */

  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1b1e24;
    --muted: #5b6270;
    --accent: #2f6fed;
    --accent-contrast: #ffffff;
    --danger: #c94b4b;
    --border: #d9dce2;
    --shadow: 0 10px 30px rgba(20, 24, 34, 0.08);

    --hover-bg: rgba(47, 111, 237, 0.08);
    --note-bg: rgba(47, 111, 237, 0.07);
    --code-bg: rgba(27, 30, 36, 0.06);
    --code-text: #b3261e;
    --table-head-bg: rgba(27, 30, 36, 0.035);
    --table-stripe: rgba(27, 30, 36, 0.028);
    --table-edge: rgba(20, 24, 34, 0.14);
    --ja-bg: #e7e9ee;
    --header-bg: rgba(244, 245, 247, 0.85);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --card-bg: #1d2027;
      --text: #eef0f4;
      --muted: #a2a9b6;
      --accent: #6f9bff;
      --accent-contrast: #0c0f14;
      --danger: #ff8383;
      --border: #30343d;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);

      --hover-bg: rgba(111, 155, 255, 0.14);
      --note-bg: rgba(111, 155, 255, 0.1);
      --code-bg: rgba(238, 240, 244, 0.09);
      --code-text: #ff9b8f;
      --table-head-bg: rgba(238, 240, 244, 0.06);
      --table-stripe: rgba(238, 240, 244, 0.045);
      --table-edge: rgba(0, 0, 0, 0.55);
      --ja-bg: #23262d;
      --header-bg: rgba(20, 22, 27, 0.85);
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  /* The document is a normal top-anchored reading page, not a centred
     flex box -- M0's counter card layout is replaced entirely. */
  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    line-height: 1.65;
  }

  #app {
    display: block;
    width: 100%;
  }

  #boot-status {
    max-width: 32rem;
    margin: 3rem auto;
    text-align: center;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: var(--shadow);
  }

  #boot-status.boot-error {
    color: var(--danger);
    border-color: var(--danger);
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  noscript {
    display: block;
    max-width: 26rem;
    margin: 2rem auto;
    text-align: center;
    color: var(--danger);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
  }

  /* -------------------------------------------------------------------
     Header: sticky brand + breadcrumb. Capped so it never costs more
     than ~3.5rem of vertical space on a phone; a long breadcrumb scrolls
     horizontally inside the bar instead of wrapping to a second line.
     ------------------------------------------------------------------- */

  #sxc1-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    min-height: 2.75rem;
    max-height: 3.5rem;
    overflow: hidden;
    padding: 0.55rem 1.1rem;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  #sxc1-header a.brand {
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }

  #sxc1-header a.brand:hover {
    color: var(--accent);
  }

  /* Everything in the header besides the brand link is treated as the
     breadcrumb, whatever element the app wraps it in. */
  #sxc1-header > *:not(.brand) {
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #sxc1-header > *:not(.brand) a {
    color: var(--muted);
    text-decoration: none;
  }

  #sxc1-header > *:not(.brand) a:hover,
  #sxc1-header > *:not(.brand) a:focus-visible {
    color: var(--accent);
    text-decoration: underline;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 0.2rem;
  }

  /* #sxc1-content-stats carries the machine-readable corpus JSON and must
     never render, under any circumstance. */
  #sxc1-content-stats,
  [hidden] {
    display: none !important;
  }

  /* -------------------------------------------------------------------
     Shared reading-column width for single-column sections.
     ------------------------------------------------------------------- */

  #sxc1-home,
  #sxc1-toc,
  #sxc1-footer {
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  /* -------------------------------------------------------------------
     Home: manual list cards.
     ------------------------------------------------------------------- */

  #sxc1-home p {
    color: var(--muted);
    margin: 0 0 1.5rem;
  }

  .manual-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.85rem;
  }

  .manual-card {
    display: block;
    min-height: 44px;
    padding: 1rem 1.15rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  .manual-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(20, 24, 34, 0.14);
  }

  .manual-card strong {
    display: block;
    font-size: 1.05rem;
    margin-bottom: 0.2rem;
  }

  .manual-card small {
    color: var(--muted);
  }

  /* -------------------------------------------------------------------
     Manual contents (table of contents).
     ------------------------------------------------------------------- */

  .toc-group {
    margin: 0 0 2.25rem;
  }

  .toc-group-title {
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 0 0 0.75rem;
    padding-bottom: 0.45rem;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
  }

  .toc-sections {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .toc-sections > li {
    border-bottom: 1px solid var(--border);
  }

  .toc-sections > li > a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 44px;
    padding: 0.6rem 0.3rem;
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }

  .toc-sections > li > a:hover,
  .toc-sections > li > a:focus-visible {
    background: var(--hover-bg);
    border-radius: 0.4rem;
  }

  .toc-page {
    flex: 0 0 auto;
    color: var(--muted);
    font-weight: 400;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .toc-subs {
    list-style: none;
    margin: 0 0 0.4rem 1rem;
    padding: 0 0 0 0.85rem;
    border-left: 2px solid var(--border);
  }

  .toc-subs li a {
    display: flex;
    align-items: center;
    min-height: 40px;
    padding: 0.35rem 0.3rem;
    color: var(--muted);
    font-size: 0.92rem;
    text-decoration: none;
  }

  .toc-subs li a:hover,
  .toc-subs li a:focus-visible {
    color: var(--accent);
    background: var(--hover-bg);
    border-radius: 0.4rem;
  }

  /* -------------------------------------------------------------------
     Page reader: header/body/JA-panel/toggle/nav on a CSS grid. One
     column by default; at >= 60rem, when the article also carries
     "ja-visible", the panel becomes a sticky second column beside the
     text. Below 60rem (or when JA is off) everything simply stacks full
     width in document order -- that is how "beside (or instead of)"
     becomes a CSS decision, never a Haskell one.
     ------------------------------------------------------------------- */

  #sxc1-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.5rem;
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 4rem;
  }

  .page-running-header {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .page-body {
    min-width: 0;
  }

  .page-body > * {
    margin: 0 0 1rem;
  }

  .page-body > *:first-child {
    margin-top: 0;
  }

  .page-body > *:last-child {
    margin-bottom: 0;
  }

  .page-body h1,
  .page-body h2,
  .page-body h3,
  .page-body h4,
  .page-body h5,
  .page-body h6 {
    margin-top: 1.5rem;
    margin-bottom: 0.55rem;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .page-body h1 { font-size: 1.75rem; }
  .page-body h2 { font-size: 1.4rem; }
  .page-body h3 { font-size: 1.15rem; }
  .page-body h4 { font-size: 1rem; }
  .page-body h5,
  .page-body h6 { font-size: 0.92rem; color: var(--muted); }

  .page-body p {
    margin: 0 0 1rem;
  }

  .page-body a {
    color: var(--accent);
  }

  .page-body ul,
  .page-body ol,
  blockquote.md-note ul,
  blockquote.md-note ol {
    margin: 0 0 1rem;
    padding-left: 1.5rem;
  }

  .page-body li {
    margin-bottom: 0.4rem;
    padding-left: 0.2rem;
  }

  .page-body li::marker,
  blockquote.md-note li::marker {
    color: var(--muted);
    font-weight: 600;
  }

  /* A "titled step" (guide-book pp.50-54: a list item whose own
     marker-line text is itself heading-shaped -- a heading marker on the
     same line as the list marker) renders its title as a real heading
     element -- the first child of the <li> -- so the h1..h4 rule above
     would otherwise push it down by its usual margin-top and detach it
     from the step number sitting beside it. Zero it here, the same way
     "blockquote.md-note > *:first-child" already does for a nested
     heading inside a "Tip" callout. */
  .page-body li > h1,
  .page-body li > h2,
  .page-body li > h3,
  .page-body li > h4 {
    margin-top: 0;
    margin-bottom: 0.4rem;
  }

  .page-body ul ul,
  .page-body ul ol,
  .page-body ol ul,
  .page-body ol ol {
    margin-top: 0.4rem;
    margin-bottom: 0.2rem;
    padding-left: 1.35rem;
  }

  /* ol[start] must keep displaying its literal start number -- default
     browser decimal counting already honours [start]; this rule only
     guards against list-style ever being reset elsewhere. */
  .page-body ol[start] {
    list-style-type: decimal;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 0.15em 0.4em;
    border-radius: 0.3em;
    white-space: nowrap;
    word-break: keep-all;
  }

  blockquote.md-note {
    margin: 1.25rem 0;
    padding: 0.9rem 1.1rem;
    border-left: 4px solid var(--accent);
    background: var(--note-bg);
    border-radius: 0 0.6rem 0.6rem 0;
    color: var(--text);
  }

  blockquote.md-note > *:first-child {
    margin-top: 0;
  }

  blockquote.md-note > *:last-child {
    margin-bottom: 0;
  }

  blockquote.md-note p {
    margin: 0 0 0.6rem;
  }

  blockquote.md-note figure.md-figure {
    margin: 0.75rem 0;
  }

  figure.md-figure {
    margin: 1.25rem 0;
    padding: 0.9rem 1.05rem;
    border: 1px dashed var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
  }

  figure.md-figure figcaption {
    font-style: italic;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--muted);
  }

  figure.md-figure figcaption::before {
    content: "Figure not reproduced \2014\0020";
    font-style: normal;
    font-weight: 600;
  }

  span.md-placeholder {
    display: inline-block;
    font-style: italic;
    font-size: 0.92em;
    color: var(--muted);
    background: var(--note-bg);
    padding: 0.05em 0.4em;
    border-radius: 0.3em;
  }

  a.page-ref {
    color: var(--accent);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.15em;
  }

  a.page-ref:hover {
    filter: brightness(1.15);
  }

  /* Tables: the mobile risk. The wrapper scrolls; the document body
     never does. */
  div.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 1.25rem 0;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    box-shadow: inset -14px 0 10px -10px var(--table-edge);
  }

  div.table-wrap table {
    border-collapse: collapse;
    width: 100%;
    min-width: 26rem;
    font-size: 0.88rem;
  }

  div.table-wrap th,
  div.table-wrap td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }

  div.table-wrap thead th {
    background: var(--table-head-bg);
    border-bottom: 2px solid var(--border);
    font-weight: 700;
    white-space: nowrap;
  }

  div.table-wrap tbody tr:nth-child(even) {
    background: var(--table-stripe);
  }

  /* -------------------------------------------------------------------
     JA panel: neutral background so a page render never blends in, plus
     a light border. Sticky beside the text only in the wide 2-column
     layout below.
     ------------------------------------------------------------------- */

  #ja-panel {
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--ja-bg);
    overflow: hidden;
  }

  #ja-panel a {
    display: block;
    line-height: 0;
  }

  #ja-image {
    width: 100%;
    height: auto;
    display: block;
    background: var(--ja-bg);
    border-bottom: 1px solid var(--border);
  }

  #ja-panel figcaption {
    padding: 0.6rem 0.85rem;
    font-size: 0.8rem;
    text-align: center;
    color: var(--muted);
  }

  #btn-ja-toggle {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    padding: 0.65rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: transparent;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease;
  }

  #btn-ja-toggle:hover {
    background: var(--hover-bg);
  }

  .page-nav {
    display: flex;
    gap: 1rem;
  }

  #btn-prev-page,
  #btn-next-page {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.65rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
    text-align: center;
  }

  #btn-prev-page:hover,
  #btn-next-page:hover {
    background: var(--hover-bg);
    border-color: var(--accent);
  }

  /* -------------------------------------------------------------------
     Footer / disclaimer.
     ------------------------------------------------------------------- */

  #sxc1-footer {
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }

  #sxc1-disclaimer {
    margin: 1.5rem 0 0;
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--muted);
    text-align: center;
  }

  /* -------------------------------------------------------------------
     Wide-viewport page grid: text column capped for reading comfort,
     JA panel a sticky sidebar spanning the full height of the page's
     rows (running header through prev/next nav). Named areas (not
     `grid-row: 1 / -1`) because there is no `grid-template-rows`, so a
     negative row line has no fixed implicit-grid end to resolve
     against; named areas give the JA column an explicit, unambiguous
     span across exactly these four rows regardless of how tall
     .page-body's own content makes the "body" row. The running header
     is optional per page -- an unused "header" cell is harmless.
     ------------------------------------------------------------------- */
  @media (min-width: 60rem) {
    #sxc1-page.ja-visible {
      max-width: 78rem;
      grid-template-columns: minmax(0, 44rem) minmax(18rem, 28rem);
      grid-template-areas:
        "header ja"
        "body   ja"
        "toggle ja"
        "nav    ja";
      column-gap: 2.5rem;
    }

    #sxc1-page.ja-visible .page-running-header { grid-area: header; }
    #sxc1-page.ja-visible .page-body { grid-area: body; }
    #sxc1-page.ja-visible #btn-ja-toggle { grid-area: toggle; }
    #sxc1-page.ja-visible .page-nav { grid-area: nav; }

    #sxc1-page.ja-visible #ja-panel {
      grid-area: ja;
      align-self: start;
      position: sticky;
      top: calc(3.5rem + 1.5rem);
    }
  }

  @media (max-width: 30rem) {
    .page-nav {
      flex-direction: column;
    }
  }

  /* =====================================================================
     M2 exercise engine. Purely additive below this line -- nothing above
     is restructured or reinterpreted. #boot-status, the <noscript>
     block, the not affiliated with Casio disclaimer text (#sxc1-footer >
     #sxc1-disclaimer, owned by site/app/View/Pages.hs) and the
     ./index.js module script tag are all exactly as M0/M1 left them.
     The Haskell contributes markup only; this is the DOM/CSS contract it
     targets (identical on every route beside M1's own
     #sxc1-content-stats):

       #app > #sxc1-exercise-stats  always [hidden]; machine-readable JSON
       #app > #sxc1-event-log       always [hidden]; machine-readable JSON

       "#/x"              #sxc1-exercise-index
                             section.ex-chapter > h2.ex-chapter-title
                               ul.ex-deck-list > li > a.ex-deck-card
                                 span.ex-deck-title, span.ex-deck-count

       "#/x/<deck>"       #sxc1-deck
                             h1#ex-deck-title, p#ex-deck-summary
                             ol.ex-list > li > a.ex-link
                               span.ex-kind.kind-quiz|kind-drill|kind-lookup
                               span.ex-title

       "#/x/<deck>/<ex>"  article#sxc1-exercise.exercise.kind-<kind>
                             h1#ex-title, p#ex-progress ("N / M"), #ex-stem
                             quiz choice: ul#ex-options > li > button.ex-option
                                          (id="opt-a"/"opt-b"/... positional,
                                          aria-pressed) + button#btn-ex-submit
                             quiz recall: button#btn-ex-reveal, #ex-answer,
                                          button#btn-ex-got,
                                          button#btn-ex-missed
                             drill:       ol#ex-steps > li.ex-step
                                            div.ex-step-instruction
                                            p.ex-step-check
                                            p.ex-verify (muted, secondary --
                                            a not-yet-active device check,
                                            never an error or a CTA)
                                            button.btn-ex-confirm
                             lookup:      p#ex-find-task, input#ex-find-input,
                                          button#btn-ex-find-submit,
                                          p#ex-elapsed ("M:SS", monospace)
                             shared:      button#btn-ex-hint,
                                          ul#ex-hints > li.ex-hint
                                          p#ex-feedback.correct|.incorrect
                                            (role="status")
                                          #ex-note
                                          ul#ex-cites > li > a.cite
                                          button#btn-ex-next,
                                          button#btn-ex-restart
                                          section#ex-summary
     ===================================================================== */

  :root {
    --success: #1f9d55;
    --success-contrast: #ffffff;
    --success-bg: rgba(31, 157, 85, 0.12);
    --incorrect-bg: rgba(201, 75, 75, 0.12);
    --kind-quiz: #6f52d8;
    --kind-quiz-bg: rgba(111, 82, 216, 0.14);
    --kind-drill: #1f8f6f;
    --kind-drill-bg: rgba(31, 143, 111, 0.14);
    --kind-lookup: #a8720f;
    --kind-lookup-bg: rgba(168, 114, 15, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --success: #4ade80;
      --success-contrast: #0c0f14;
      --success-bg: rgba(74, 222, 128, 0.16);
      --incorrect-bg: rgba(255, 131, 131, 0.14);
      --kind-quiz: #b9a4ff;
      --kind-quiz-bg: rgba(185, 164, 255, 0.16);
      --kind-drill: #5eead4;
      --kind-drill-bg: rgba(94, 234, 212, 0.14);
      --kind-lookup: #ffcf6e;
      --kind-lookup-bg: rgba(255, 207, 110, 0.16);
    }
  }

  /* Belt-and-suspenders: the two machine-readable JSON carriers must
     never be revealable even if something targets them specifically
     rather than relying only on the generic [hidden] rule above. */
  #sxc1-exercise-stats,
  #sxc1-event-log {
    display: none !important;
  }

  /* -------------------------------------------------------------------
     Exercise index ("#/x"): chapters of deck cards. Long titles/labels
     anywhere in this section wrap instead of widening the page.
     ------------------------------------------------------------------- */

  #sxc1-exercise-index,
  #sxc1-deck,
  #sxc1-exercise {
    overflow-wrap: anywhere;
  }

  #sxc1-exercise-index {
    max-width: 60rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  .ex-chapter {
    margin: 0 0 2.5rem;
  }

  .ex-chapter-title {
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 0 0 0.9rem;
    padding-bottom: 0.45rem;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
  }

  .ex-deck-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  @media (min-width: 34rem) {
    .ex-deck-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (min-width: 54rem) {
    .ex-deck-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  .ex-deck-card {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-height: 44px;
    padding: 1rem 1.15rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  .ex-deck-card:hover,
  .ex-deck-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(20, 24, 34, 0.14);
  }

  .ex-deck-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
  }

  .ex-deck-count {
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* -------------------------------------------------------------------
     Deck page ("#/x/<deck>"): the ordered exercise list.
     ------------------------------------------------------------------- */

  #sxc1-deck {
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  #ex-deck-title {
    margin: 0 0 0.5rem;
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  #ex-deck-summary {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }

  .ex-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .ex-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-height: 44px;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
  }

  .ex-link:hover,
  .ex-link:focus-visible {
    background: var(--hover-bg);
    border-color: var(--accent);
  }

  .ex-kind {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.5rem;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .ex-kind.kind-quiz {
    background: var(--kind-quiz-bg);
    color: var(--kind-quiz);
  }

  .ex-kind.kind-drill {
    background: var(--kind-drill-bg);
    color: var(--kind-drill);
  }

  .ex-kind.kind-lookup {
    background: var(--kind-lookup-bg);
    color: var(--kind-lookup);
  }

  .ex-title {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 600;
  }

  /* -------------------------------------------------------------------
     Runner ("#/x/<deck>/<ex>"): stem, progress, and per-kind body.
     ------------------------------------------------------------------- */

  #sxc1-exercise {
    max-width: 38rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 4rem;
  }

  /* Block flow, not a flex column: #ex-find-input and #btn-ex-find-submit
     are flat siblings in the DOM contract (no wrapper element) and must
     sit beside each other as ordinary inline-level boxes, which a
     column flex container's implicit one-child-per-row layout would
     prevent regardless of either element's own width. */
  #sxc1-exercise > * {
    margin: 0 0 1.25rem;
  }

  #sxc1-exercise > *:first-child {
    margin-top: 0;
  }

  #sxc1-exercise > *:last-child {
    margin-bottom: 0;
  }

  #ex-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  #ex-progress {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #ex-stem {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text);
  }

  #ex-stem > *:first-child {
    margin-top: 0;
  }

  #ex-stem > *:last-child {
    margin-bottom: 0;
  }

  /* Quiz choice mode: full-width tappable options. */

  #ex-options {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .ex-option {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 44px;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-size: 0.98rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .ex-option:hover {
    background: var(--hover-bg);
  }

  /* Selection is never colour-only: the border switches to the accent
     colour AND a check mark appears, on top of the colour change. */
  .ex-option[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--hover-bg);
    font-weight: 700;
  }

  .ex-option[aria-pressed="true"]::after {
    content: "\2713";
    margin-left: auto;
    flex: 0 0 auto;
    color: var(--accent);
    font-weight: 700;
  }

  /* Shared action buttons. Primary (filled) by default; the quieter
     follow-up actions (hint, missed, restart) are outlined so they never
     compete with the one action that moves the learner forward. */
  #btn-ex-submit,
  #btn-ex-reveal,
  #btn-ex-got,
  #btn-ex-missed,
  #btn-ex-next,
  #btn-ex-restart,
  #btn-ex-hint,
  #btn-ex-find-submit,
  .btn-ex-confirm {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.7rem 1.3rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.12s ease, background 0.12s ease;
  }

  #btn-ex-submit:hover,
  #btn-ex-reveal:hover,
  #btn-ex-got:hover,
  #btn-ex-next:hover,
  #btn-ex-find-submit:hover,
  .btn-ex-confirm:hover {
    filter: brightness(1.08);
  }

  /* These are each the one standalone call to action on their own line,
     so (unlike #btn-ex-find-submit, which sits beside #ex-find-input)
     they run the full measure for an easy, unambiguous tap target. */
  #btn-ex-submit,
  #btn-ex-reveal,
  #btn-ex-got,
  #btn-ex-missed,
  #btn-ex-next,
  #btn-ex-restart,
  #btn-ex-hint,
  .btn-ex-confirm {
    display: flex;
    width: 100%;
  }

  #btn-ex-missed,
  #btn-ex-restart,
  #btn-ex-hint {
    background: transparent;
    color: var(--accent);
  }

  #btn-ex-missed:hover,
  #btn-ex-restart:hover,
  #btn-ex-hint:hover {
    background: var(--hover-bg);
  }

  #ex-answer {
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
  }

  /* Drill steps: numbered by the browser's own <ol> markers. */

  #ex-steps {
    padding-left: 1.4rem;
  }

  #ex-steps > .ex-step::marker {
    color: var(--muted);
    font-weight: 700;
  }

  .ex-step {
    padding-left: 0.3rem;
    margin-bottom: 1.1rem;
  }

  .ex-step:last-child {
    margin-bottom: 0;
  }

  .ex-step-instruction {
    margin: 0 0 0.4rem;
    color: var(--text);
  }

  /* Visually distinct from the instruction above it: a small labelled
     card rather than a plain paragraph, so "how you know it worked"
     reads as a separate, checkable claim. */
  .ex-step-check {
    margin: 0 0 0.4rem;
    padding: 0.55rem 0.8rem;
    border-left: 3px solid var(--accent);
    border-radius: 0 0.4rem 0.4rem 0;
    background: var(--note-bg);
    color: var(--text);
    font-size: 0.92rem;
  }

  /* A not-yet-active device check (M4 wires it up later). Muted and
     secondary on purpose -- it must never read as an error or a call to
     action, so no accent colour and no background tint. */
  .ex-verify {
    margin: 0;
    padding: 0.4rem 0.8rem;
    border-left: 3px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
  }

  /* Lookup. */

  #ex-find-task {
    margin: 0 0 0.75rem;
    color: var(--text);
  }

  #ex-find-input {
    display: inline-block;
    width: 8rem;
    max-width: 100%;
    min-height: 44px;
    margin: 0 0.6rem 0.6rem 0;
    padding: 0.6rem 0.8rem;
    vertical-align: middle;
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  #ex-find-input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  #btn-ex-find-submit {
    vertical-align: middle;
  }

  #ex-elapsed {
    margin: 0.6rem 0 0;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  /* Hints: de-emphasised, progressively revealed. */

  #ex-hints {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .ex-hint {
    padding: 0.55rem 0.8rem;
    border: 1px dashed var(--border);
    border-radius: 0.5rem;
    background: var(--note-bg);
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }

  /* Feedback: never colour-only -- a symbol precedes the text and the
     weight is already bold. */

  #ex-feedback {
    padding: 0.75rem 1rem;
    border-radius: 0.6rem;
    font-weight: 700;
    line-height: 1.5;
  }

  #ex-feedback::before {
    margin-right: 0.4rem;
    font-weight: 700;
  }

  #ex-feedback.correct {
    background: var(--success-bg);
    color: var(--success);
  }

  #ex-feedback.correct::before {
    content: "\2713";
  }

  #ex-feedback.incorrect {
    background: var(--incorrect-bg);
    color: var(--danger);
  }

  #ex-feedback.incorrect::before {
    content: "\2715";
  }

  #ex-note {
    padding: 0.9rem 1.1rem;
    border-left: 4px solid var(--accent);
    border-radius: 0 0.6rem 0.6rem 0;
    background: var(--note-bg);
    color: var(--text);
  }

  #ex-note > *:first-child {
    margin-top: 0;
  }

  #ex-note > *:last-child {
    margin-bottom: 0;
  }

  #ex-cites {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  /* Visually distinct from ordinary body links: a leading arrow glyph
     (matching figure.md-figure figcaption's existing hex-escape-glyph
     convention) as well as the bold weight, so a citation reads at a
     glance as a jump into the manual rather than a same-page link. */
  a.cite {
    color: var(--accent);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.15em;
  }

  a.cite::before {
    content: "\2192\0020";
    font-weight: 700;
  }

  a.cite:hover {
    filter: brightness(1.15);
  }

  #ex-summary {
    margin-top: 0.5rem;
    padding: 1.25rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    color: var(--text);
  }

  #ex-summary > *:first-child {
    margin-top: 0;
  }

  #ex-summary > *:last-child {
    margin-bottom: 0;
  }
</style>
</head>
