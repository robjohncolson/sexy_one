  /* =====================================================================
     M4 live-device verification (briefs/M4-plan.md section 3.8, manifest
     task "device-styles"). Purely additive below this line, plus exactly
     one selector added above: #sxc1-device-state (the always-[hidden]
     device-state JSON blob, rendered on every route) joins the M1 rule
     that already hides #sxc1-content-stats rather than gaining a
     duplicate of it.

     New DOM surface, drill runner only ("#/x/<deck>/<ex>", kind-drill),
     rendered by the app only when Web MIDI is available AND the exercise
     carries a verify: hook -- never at boot, never on quizzes or
     lookups. A browser without Web MIDI renders no #ex-device at all and
     no verify state beyond .ex-verify-idle, and must look exactly as M3
     did, so nothing below may restyle an M3-era node:

       section#ex-device               the device panel, a card in the
                                       runner column (a column at every
                                       width -- 320px must not overflow)
         button#btn-device-enable        the ONLY control that ever
                                          requests MIDI permission; its
                                          label tracks the status
         p#device-status                 one plain sentence,
                                          status-dependent
         select#sel-device-channel       MIDI channel 1..16
         p#device-ports                  bound port names, or the
                                          "nothing detected" line
         button#btn-device-use-channel   shown only on a channel mismatch

       p.ex-verify (M2) gains exactly one state class per render:
         .ex-verify-idle        off or unsupported; M2's bare look
         .ex-verify-waiting     armed and listening for the device
         .ex-verify-confirmed   this step was confirmed by the device
     ===================================================================== */

  /* -------------------------------------------------------------------
     Device panel. A quiet card in the runner column: the drill's one
     forward action stays the accent-filled Confirm button, so both
     panel buttons take the outlined (hint-style) treatment and never
     compete with it. Always a single column; long port names and
     status sentences wrap (overflow-wrap) instead of widening the
     page, so the panel stays usable at 320px.
     ------------------------------------------------------------------- */

  #ex-device {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    overflow-wrap: anywhere;
  }

  /* Both buttons get their visible focus indicator from the global
     a:focus-visible/button:focus-visible outline rule, like every other
     button in the file. */
  #btn-device-enable,
  #btn-device-use-channel {
    appearance: none;
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.65rem 1.1rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: transparent;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease;
  }

  #btn-device-enable:hover,
  #btn-device-use-channel:hover {
    background: var(--hover-bg);
  }

  #device-status {
    margin: 0;
    font-size: 0.9rem;
    color: var(--text);
  }

  #sel-device-channel {
    align-self: flex-start;
    min-height: 44px;
    max-width: 100%;
    padding: 0.5rem 0.8rem;
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }

  /* A <select>, not a button, so the global button:focus-visible rule
     misses it; mirror #ex-find-input's focus treatment instead. */
  #sel-device-channel:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  #device-ports {
    margin: 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* =====================================================================
     Today's session ("#/x/today"). Five adaptive DOM cards plus a small
     body-level coach bar while a planned exercise is open. The bar lives
     outside Miso's managed tree, so engine renders cannot disturb it.
     ===================================================================== */

  #sxc1-session {
    max-width: 54rem;
    margin: 0 auto;
    padding: 1.5rem clamp(0.75rem, 3vw, 2rem) 3.5rem;
  }

  .session-hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem);
    gap: 0.35rem 2rem;
    align-items: end;
    margin-bottom: 1rem;
  }

  .session-kicker,
  .session-intro,
  .session-meter {
    margin: 0;
  }

  .session-kicker {
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .session-hero h1 {
    grid-column: 1;
    margin: 0;
    font-size: clamp(1.85rem, 6vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.045em;
  }

  .session-intro {
    grid-column: 1;
    max-width: 39rem;
    color: var(--muted);
    line-height: 1.55;
  }

  .session-meter {
    grid-column: 2;
    grid-row: 1 / span 3;
    display: grid;
    gap: 0.35rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  .session-meter span {
    color: var(--muted);
    font-size: 0.78rem;
  }

  .session-progress {
    width: 100%;
    height: 0.6rem;
    border: 0;
    accent-color: var(--success);
  }

  .session-list {
    display: grid;
    gap: 0.55rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .session-card {
    display: grid;
    grid-template-columns: 2.25rem minmax(0, 1fr) auto;
    gap: 0.8rem;
    align-items: center;
    min-height: 76px;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  .session-card:hover,
  .session-card:focus-visible {
    border-color: var(--accent);
  }

  .session-number {
    display: grid;
    width: 2.15rem;
    height: 2.15rem;
    place-items: center;
    border-radius: 50%;
    background: var(--note-bg);
    color: var(--accent);
    font-weight: 850;
    font-variant-numeric: tabular-nums;
  }

  .session-copy {
    display: grid;
    gap: 0.1rem;
    min-width: 0;
  }

  .session-reason {
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 850;
    letter-spacing: 0.025em;
    text-transform: uppercase;
  }

  .session-title {
    overflow: hidden;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-context,
  .session-status {
    color: var(--muted);
    font-size: 0.74rem;
  }

  .session-status {
    padding: 0.15rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    white-space: nowrap;
  }

  .session-item.is-done .session-card {
    box-shadow: none;
    opacity: 0.75;
  }

  .session-item.is-done .session-number {
    background: var(--success-bg);
    color: var(--success);
  }

  .session-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.65rem;
    align-items: stretch;
    margin-top: 1rem;
  }

  .session-actions .primary-training-action {
    display: grid;
    place-items: center;
    min-height: 52px;
    padding: 0.65rem 1rem;
  }

  .session-reset {
    min-height: 48px;
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-weight: 750;
    cursor: pointer;
  }

  .session-index-card {
    margin: 0 0 0.65rem;
    border-color: var(--success);
    background: var(--success-bg);
  }

  .weekly-index-card {
    margin: 0 0 0.65rem;
    border-color: #7d5bd6;
    background: color-mix(in srgb, #7d5bd6 9%, var(--card-bg));
  }

  body.session-coach-active {
    padding-bottom: calc(5.25rem + env(safe-area-inset-bottom, 0px));
  }

  .session-coach {
    position: fixed;
    right: max(0.65rem, env(safe-area-inset-right, 0px));
    bottom: max(0.65rem, env(safe-area-inset-bottom, 0px));
    left: max(0.65rem, env(safe-area-inset-left, 0px));
    z-index: 100;
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    gap: 0.65rem 1rem;
    align-items: center;
    max-width: 58rem;
    min-height: 58px;
    margin: 0 auto;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--accent);
    border-radius: 0.9rem;
    background: color-mix(in srgb, var(--card-bg) 94%, transparent);
    box-shadow: 0 12px 36px rgb(0 0 0 / 22%);
    backdrop-filter: blur(12px);
  }

  .session-coach a {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    color: var(--text);
    font-weight: 800;
    text-decoration: none;
  }

  .session-coach-position {
    white-space: nowrap;
  }

  .session-coach-live {
    overflow: hidden;
    color: var(--muted);
    font-size: 0.78rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-coach-next {
    justify-content: center;
    padding: 0 0.8rem;
    border-radius: 0.6rem;
    background: var(--accent);
    color: #fff !important;
  }

  .session-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    color: var(--text);
    font-weight: 750;
    text-decoration: none;
  }

  @media (max-width: 42rem) {
    .session-hero {
      display: block;
    }

    .session-hero > * + * {
      margin-top: 0.5rem;
    }

    .session-meter {
      margin-top: 0.9rem !important;
    }

    .session-card {
      grid-template-columns: 2.25rem minmax(0, 1fr);
    }

    .session-status {
      grid-column: 2;
      justify-self: start;
    }

    .session-actions {
      grid-template-columns: 1fr;
    }

    body.session-coach-active {
      padding-bottom: calc(7.2rem + env(safe-area-inset-bottom, 0px));
    }

    .session-coach {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.15rem 0.7rem;
    }

    .session-coach-back {
      grid-column: 1;
    }

    .session-coach-position {
      grid-column: 1;
      grid-row: 2;
      font-size: 0.78rem;
    }

    .session-coach-live {
      display: none;
    }

    .session-coach-next {
      grid-column: 2;
      grid-row: 1 / span 2;
    }
  }

  /* =====================================================================
     Weekly Pulse ("#/x/week"). A bounded progress projection rendered as
     ordinary semantic DOM: seven small forecast bars, two insight lists,
     and one next-focus action. No graph/GPU runtime.
     ===================================================================== */

  #sxc1-weekly {
    max-width: 64rem;
    margin: 0 auto;
    padding: 1.5rem clamp(0.75rem, 3vw, 2rem) 3.5rem;
  }

  .weekly-hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(13rem, 18rem);
    gap: 0.35rem 2rem;
    align-items: end;
  }

  .weekly-kicker,
  .weekly-intro,
  .weekly-hero h1,
  .weekly-rhythm,
  .weekly-section-heading h2,
  .weekly-section-heading p,
  .weekly-notes p {
    margin: 0;
  }

  .weekly-kicker {
    color: #7d5bd6;
    font-size: 0.75rem;
    font-weight: 850;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .weekly-hero h1 {
    grid-column: 1;
    font-size: clamp(1.85rem, 6vw, 3.15rem);
    line-height: 1.05;
    letter-spacing: -0.045em;
  }

  .weekly-intro {
    grid-column: 1;
    max-width: 42rem;
    color: var(--muted);
    line-height: 1.55;
  }

  .weekly-rhythm {
    grid-column: 2;
    grid-row: 1 / span 3;
    display: grid;
    gap: 0.35rem;
    padding: 1rem;
    border: 1px solid #7d5bd6;
    border-radius: 0.9rem;
    background: color-mix(in srgb, #7d5bd6 8%, var(--card-bg));
    box-shadow: var(--shadow);
  }

  .weekly-rhythm strong {
    font-size: 1.1rem;
  }

  .weekly-rhythm span {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.45;
  }

  .weekly-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.55rem;
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
  }

  .weekly-stats li {
    display: grid;
    gap: 0.1rem;
    min-width: 0;
    padding: 0.7rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
  }

  .weekly-stats strong {
    font-size: 1.2rem;
    font-variant-numeric: tabular-nums;
  }

  .weekly-stats span {
    color: var(--muted);
    font-size: 0.72rem;
  }

  .weekly-section {
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 0.95rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  .weekly-forecast-section {
    margin-top: 1rem;
  }

  .weekly-section-heading h2 {
    font-size: clamp(1.15rem, 3vw, 1.45rem);
  }

  .weekly-section-heading p {
    margin-top: 0.2rem;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.45;
  }

  .weekly-forecast {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: clamp(0.25rem, 2vw, 0.7rem);
    height: 11.5rem;
    list-style: none;
    margin: 0.9rem 0 0;
    padding: 0;
  }

  .weekly-forecast li {
    display: grid;
    grid-template-rows: 1.2rem minmax(0, 1fr) 1.2rem;
    gap: 0.25rem;
    min-width: 0;
    text-align: center;
  }

  .weekly-bar-count,
  .weekly-bar-day {
    overflow: hidden;
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .weekly-bar-day {
    color: var(--muted);
  }

  .weekly-bar-track {
    position: relative;
    display: block;
    width: min(1.7rem, 70%);
    height: 100%;
    justify-self: center;
    overflow: hidden;
    border-radius: 0.45rem 0.45rem 0.2rem 0.2rem;
    background: var(--note-bg);
  }

  .weekly-bar-fill {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    display: block;
    min-height: 2px;
    border-radius: inherit;
    background: linear-gradient(180deg, #9b7de0, #6f4bc7);
  }

  .weekly-insight-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .weekly-insight-list {
    display: grid;
    gap: 0.45rem;
    list-style: none;
    margin: 0.75rem 0 0;
    padding: 0;
  }

  .weekly-insight-link {
    display: grid;
    gap: 0.15rem;
    min-height: 58px;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 0.65rem;
    color: var(--text);
    text-decoration: none;
  }

  .weekly-insight-link:hover,
  .weekly-insight-link:focus-visible {
    border-color: #7d5bd6;
    background: color-mix(in srgb, #7d5bd6 6%, var(--card-bg));
  }

  .weekly-insight-link span,
  .weekly-empty {
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.4;
  }

  .weekly-empty {
    margin: 0.75rem 0 0;
  }

  .weekly-focus {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(11rem, 16rem);
    gap: 0.75rem 1.25rem;
    align-items: center;
    margin-top: 0.75rem;
    padding: 1rem;
    border: 1px solid var(--success);
    border-radius: 0.95rem;
    background: var(--success-bg);
  }

  .weekly-focus-copy {
    display: grid;
    gap: 0.25rem;
  }

  .weekly-focus-label {
    color: var(--success);
    font-size: 0.72rem;
    font-weight: 850;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .weekly-focus .primary-training-action {
    display: grid;
    min-height: 48px;
    place-items: center;
    padding: 0.6rem 0.8rem;
    text-align: center;
  }

  .weekly-notes {
    display: grid;
    gap: 0.35rem;
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 0.73rem;
    line-height: 1.45;
  }

  .weekly-tracking-note {
    padding: 0.65rem 0.75rem;
    border-left: 3px solid #7d5bd6;
    background: color-mix(in srgb, #7d5bd6 6%, var(--card-bg));
  }

  .mastery-weekly-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 800;
  }

  @media (max-width: 42rem) {
    .weekly-hero {
      display: block;
    }

    .weekly-hero > * + * {
      margin-top: 0.5rem;
    }

    .weekly-rhythm {
      margin-top: 0.9rem !important;
    }

    .weekly-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .weekly-forecast {
      gap: 0.2rem;
      height: 10rem;
    }

    .weekly-section {
      padding: 0.85rem;
    }

    .weekly-insight-grid,
    .weekly-focus {
      grid-template-columns: 1fr;
    }

    .weekly-focus .primary-training-action {
      width: 100%;
    }
  }

  /* =====================================================================
     Mastery journey ("#/x/map"). A DOM-only action queue and progressively
     disclosed chapter trail; no canvas or GPU context is created.
     ===================================================================== */

  #sxc1-mastery {
    max-width: 72rem;
    margin: 0 auto;
    padding: 1.5rem clamp(0.75rem, 3vw, 2rem) 3.5rem;
  }

  .mastery-hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(12rem, 16rem);
    gap: 0.35rem 2rem;
    align-items: end;
    margin-bottom: 1.25rem;
  }

  .mastery-kicker,
  .mastery-intro,
  .mastery-summary {
    margin: 0;
  }

  .mastery-kicker {
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .mastery-hero h1 {
    grid-column: 1;
    margin: 0;
    font-size: clamp(1.75rem, 5vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.04em;
  }

  .mastery-intro {
    grid-column: 1;
    max-width: 50rem;
    color: var(--muted);
  }

  .mastery-summary {
    grid-column: 2;
    grid-row: 1 / span 3;
    display: grid;
    gap: 0.6rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  .mastery-summary strong {
    line-height: 1.35;
  }

  .mastery-overall-progress,
  .mastery-chapter-progress {
    width: 100%;
    height: 0.55rem;
    border: 0;
    accent-color: var(--success);
  }

  .mastery-legend {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    list-style: none;
    margin: 0.8rem 0 0;
    padding: 0;
  }

  .mastery-legend li {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    min-height: 30px;
    padding: 0.15rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--muted);
    font-size: 0.73rem;
  }

  .mastery-legend-count {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 850;
  }

  .mastery-section-heading h2,
  .mastery-section-heading p,
  .mastery-chapter-heading h3,
  .mastery-chapter-heading p {
    margin: 0;
  }

  .mastery-section-heading h2 {
    font-size: clamp(1.25rem, 3vw, 1.65rem);
  }

  .mastery-section-heading p,
  .mastery-chapter-heading p {
    color: var(--muted);
    font-size: 0.88rem;
  }

  .mastery-next,
  .mastery-route {
    margin-top: 1.25rem;
  }

  .mastery-queue {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.7rem;
    list-style: none;
    margin: 0.75rem 0 0;
    padding: 0;
  }

  .mastery-queue-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.45rem 0.75rem;
    align-items: center;
    min-height: 8.2rem;
    padding: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 0.85rem;
    background: var(--card-bg);
    color: var(--text);
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  .mastery-queue .is-primary .mastery-queue-card {
    border-color: var(--accent);
    background: var(--note-bg);
  }

  .mastery-queue-card:hover,
  .mastery-queue-card:focus-visible,
  .mastery-trail-link:hover,
  .mastery-trail-link:focus-visible {
    border-color: var(--accent);
  }

  .mastery-queue-reason {
    grid-column: 1 / -1;
    color: var(--accent);
    font-size: 0.73rem;
    font-weight: 850;
    letter-spacing: 0.02em;
  }

  .mastery-deck-copy {
    display: grid;
    gap: 0.2rem;
    min-width: 0;
  }

  .mastery-deck-title {
    line-height: 1.3;
  }

  .mastery-deck-evidence {
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.45;
  }

  .mastery-band {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 0.1rem 0.5rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    color: #6b7280;
    font-size: 0.68rem;
    font-weight: 800;
    white-space: nowrap;
  }

  .mastery-band-learning { color: #2f6fed; }
  .mastery-band-practiced { color: #7d5bd6; }
  .mastery-band-consolidating { color: #b85f00; }
  .mastery-band-strong { color: var(--success); }

  .mastery-route {
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  .mastery-chapter-tabs {
    display: flex;
    gap: 0.45rem;
    margin: 0.85rem -0.2rem 0;
    padding: 0.2rem 0.2rem 0.6rem;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    scrollbar-width: thin;
  }

  .mastery-chapter-tab {
    flex: 0 0 min(13.5rem, 72vw);
    min-height: 54px;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 0.65rem;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .mastery-chapter-tab strong,
  .mastery-chapter-tab span {
    display: block;
  }

  .mastery-chapter-tab span {
    color: var(--muted);
    font-size: 0.7rem;
  }

  .mastery-chapter-tab[aria-selected="true"] {
    border-color: var(--accent);
    background: var(--note-bg);
    box-shadow: inset 0 -3px 0 var(--accent);
  }

  .mastery-chapter-panel {
    margin-top: 0.75rem;
  }

  .mastery-chapter-heading {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(8rem, 15rem);
    gap: 0.2rem 1rem;
    align-items: center;
    padding: 0.2rem 0 0.75rem;
  }

  .mastery-chapter-heading h3 {
    font-size: 1.15rem;
  }

  .mastery-chapter-progress {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  .mastery-trail {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .mastery-trail-item {
    position: relative;
    padding: 0 0 0.8rem 1.45rem;
  }

  .mastery-trail-item::before {
    content: "";
    position: absolute;
    left: 0.2rem;
    top: 1.15rem;
    z-index: 1;
    width: 0.7rem;
    height: 0.7rem;
    border: 3px solid var(--card-bg);
    border-radius: 50%;
    background: #7b8494;
    box-shadow: 0 0 0 1px var(--border);
  }

  .mastery-trail-item:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 0.53rem;
    top: 1.55rem;
    bottom: -0.1rem;
    width: 2px;
    background: var(--border);
  }

  .mastery-trail-learning::before { background: #2f6fed; }
  .mastery-trail-practiced::before { background: #7d5bd6; }
  .mastery-trail-consolidating::before { background: #d97706; }

  /* -------------------------------------------------------------------
     The three verify-line states. Never colour-only (WCAG 1.4.1): idle
     stays italic with no glyph, waiting turns upright and gains a
     leading ellipsis, confirmed gains a leading check mark and bold
     weight (glyphs follow #ex-feedback's hex-escape convention). Idle
     deliberately restates M2's bare .ex-verify values and adds nothing
     else -- a browser without Web MIDI carries this class and must look
     exactly as M3 did. The state-change transition is disabled under
     prefers-reduced-motion below.
     ------------------------------------------------------------------- */

  .ex-verify.ex-verify-idle,
  .ex-verify.ex-verify-waiting,
  .ex-verify.ex-verify-confirmed {
    transition: color 0.12s ease, background 0.12s ease,
      border-color 0.12s ease;
  }

  .ex-verify.ex-verify-idle {
    border-left-color: var(--border);
    color: var(--muted);
    font-style: italic;
  }

  .ex-verify.ex-verify-waiting {
    border-left-color: var(--accent);
    border-radius: 0 0.4rem 0.4rem 0;
    background: var(--note-bg);
    color: var(--text);
    font-style: normal;
  }

  .ex-verify.ex-verify-waiting::before {
    content: "\2026\0020";
    font-weight: 700;
    color: var(--accent);
  }

  .ex-verify.ex-verify-confirmed {
    border-left-color: var(--success);
    border-radius: 0 0.4rem 0.4rem 0;
    background: var(--success-bg);
    color: var(--success);
    font-style: normal;
    font-weight: 700;
  }

  .ex-verify.ex-verify-confirmed::before {
    content: "\2713\0020";
  }

    background: rgba(70, 225, 183, 0.04);
    color: #aeb8ca;
    text-align: center;
  }

  .sample-dropzone strong {
    color: #ffffff;
    font-size: 1.05rem;
  }

  .sample-dropzone span {
    font-size: 0.8rem;
  }

  .sample-dropzone.is-dragging {
    border-style: solid;
    background: rgba(70, 225, 183, 0.12);
  }

  .sample-button {
    display: inline-flex;
    min-height: 46px;
    align-items: center;
    justify-content: center;
    padding: 0.7rem 1rem;
    border: 1px solid transparent;
    border-radius: 0.62rem;
    font: inherit;
    font-size: 0.86rem;
    font-weight: 800;
    line-height: 1.2;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }

  .sample-button-primary {
    border-color: #68e9c1;
    background: #68e9c1;
    color: #07130f;
  }

  .sample-button-secondary {
    border-color: rgba(255, 255, 255, 0.18);
    background: #242833;
    color: #f7f8fb;
  }

  .sample-button-danger {
    border-color: rgba(255, 113, 121, 0.5);
    background: rgba(255, 85, 95, 0.12);
    color: #ff9ba1;
  }

  .sample-button:hover,
  .sample-button:focus-visible {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  .sample-button:disabled {
    cursor: not-allowed;
    filter: none;
    opacity: 0.42;
    transform: none;
  }

  .sample-waveform {
    display: flex;
    height: 5rem;
    align-items: center;
    gap: 2px;
    overflow: hidden;
    margin: 0 0 0.8rem;
    padding: 0.55rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0.65rem;
    background: #0e1016;
  }

  .sample-waveform > span:not(.sample-waveform-empty) {
    flex: 1 1 auto;
    min-width: 1px;
    border-radius: 2px;
    background: linear-gradient(#7bf2ce, #557cff);
  }

  .sample-waveform-empty {
    margin: auto;
    color: #6e778a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.25em;
  }

  .sample-file-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-bottom: 0.7rem;
  }

  .sample-file-facts span {
    padding: 0.25rem 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: #adb5c5;
    font-size: 0.66rem;
    font-weight: 700;
  }

  .sample-file-facts span.is-ready {
    border-color: rgba(70, 225, 183, 0.35);
    color: #7bf2ce;
  }

  .sample-metadata-grid {
    margin-top: 1rem;
  }

  .sample-action-row,
  .sample-primary-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    margin-top: 1rem;
  }

  .sample-planner-footer {
    margin-top: 1.25rem;
  }

  .sample-project-tools {
    margin-top: 0.85rem;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 0.72rem;
    background: rgba(255, 255, 255, 0.025);
  }

  .sample-project-tools > summary {
    min-height: 44px;
    padding: 0.72rem 1rem;
    color: #aeb6c5;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 750;
  }

  .sample-project-tools-body {
    display: grid;
    gap: 0.8rem;
    padding: 0 1rem 1rem;
  }

  .sample-project-tools-body .sample-button {
    width: 100%;
  }

  .sample-handoff-shell {
    max-width: 48rem;
  }

  .sample-validation-shell {
    max-width: 48rem;
  }

  .sample-validation-hero {
    padding-bottom: 1.5rem;
  }

  .sample-validation-card {
    padding: clamp(1rem, 4vw, 1.8rem);
    border: 1px solid rgba(255, 190, 90, 0.28);
    border-radius: 1rem;
    background: linear-gradient(150deg, rgba(36, 32, 28, 0.98), rgba(18, 18, 22, 0.98));
    box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.32);
  }

  .sample-validation-card.has-blocker {
    border-color: rgba(255, 113, 121, 0.42);
  }

  .sample-validation-summary {
    margin: 0;
    color: #ffffff;
    font-size: 1rem;
  }

  .sample-validation-list {
    display: grid;
    gap: 0.6rem;
    margin: 1rem 0;
    padding: 0;
    list-style: none;
  }

  .sample-validation-list li {
    display: grid;
    grid-template-columns: 1.6rem minmax(0, 1fr);
    gap: 0.65rem;
    align-items: start;
    padding: 0.75rem;
    border-radius: 0.6rem;
    background: rgba(255, 190, 90, 0.07);
    color: #d3d8e2;
    font-size: 0.82rem;
    line-height: 1.45;
  }

  .sample-validation-list li > strong {
    display: grid;
    width: 1.45rem;
    height: 1.45rem;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 190, 90, 0.17);
    color: #ffcb7c;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .sample-validation-list li.is-blocking {
    background: rgba(255, 85, 95, 0.09);
  }

  .sample-validation-list li.is-blocking > strong {
    background: rgba(255, 85, 95, 0.17);
    color: #ff9ba1;
  }

  .sample-handoff-hero {
    padding-bottom: 1.5rem;
  }

  .sample-handoff-hero h1 {
    max-width: 10ch;
  }

  .sample-handoff-back {
    display: inline-block;
    margin-top: 1.25rem;
  }

  .sample-handoff-card {
    padding: clamp(1.1rem, 4vw, 2rem);
    border: 1px solid rgba(123, 242, 206, 0.25);
    border-radius: 1rem;
    background: linear-gradient(150deg, rgba(29, 35, 43, 0.98), rgba(15, 18, 24, 0.98));
    box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.34);
  }

  .sample-handoff-progress {
    margin: 0 0 0.65rem;
    color: #7bf2ce;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sample-handoff-destination {
    margin: 0;
    color: #ffffff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(1.45rem, 5vw, 2.35rem);
    letter-spacing: -0.035em;
  }

  .sample-handoff-name {
    display: block;
    margin-top: 0.55rem;
    color: #c8cfdd;
    font-size: 1rem;
  }

  .sample-handoff-info {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.35rem 0.8rem;
    margin: 1rem 0;
    padding: 0.75rem;
    border-radius: 0.55rem;
    background: rgba(255, 255, 255, 0.035);
    font-size: 0.78rem;
  }

  .sample-handoff-info dt {
    color: #858fa3;
    font-weight: 750;
  }

  .sample-handoff-info dd {
    min-width: 0;
    overflow-wrap: anywhere;
    margin: 0;
    color: #e2e6ef;
  }

  .sample-handoff-steps {
    display: grid;
    gap: 0.75rem;
    margin: 1.2rem 0;
    padding-left: 1.5rem;
    color: #b8c0cf;
    line-height: 1.55;
  }

  .sample-handoff-steps li::marker {
    color: #7bf2ce;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 800;
  }

  @media (min-width: 48rem) {
    .sample-lab-shell[data-layout="wide"] {
      width: min(100% - 3rem, 72rem);
    }

    .sample-bank-panel {
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) minmax(15rem, 1.5fr);
      gap: 0.9rem 1.5rem;
      align-items: end;
    }

    .sample-bank-panel > .sample-panel-heading {
      grid-column: 1 / -1;
    }

    .sample-bank-tabs,
    .sample-bank-fields {
      margin-top: 0;
    }

    .sample-pad-grid {
      gap: 0.85rem;
    }

    .sample-metadata-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .sample-metadata-grid .sample-field:nth-child(1),
    .sample-metadata-grid .sample-field:nth-child(2),
    .sample-metadata-grid .sample-field:nth-child(3) {
      grid-column: span 2;
    }
  }

  @media (max-width: 36rem) {
    .sample-lab-shell {
      width: min(100% - 1rem, 72rem);
      padding-top: 0.5rem;
    }

    .sample-lab-header {
      align-items: flex-start;
    }

    .sample-local-badge {
      max-width: 55%;
      font-size: 0.62rem;
    }

    .sample-hero {
      padding-top: 2.5rem;
    }

    .sample-section-top {
      display: block;
    }

    .sample-help {
      margin-top: 0.45rem;
    }

    .sample-panel {
      padding: 0.85rem;
    }

    .sample-bank-fields,
    .sample-metadata-grid,
    .sample-library-fields,
    .sample-library-filters,
    .sample-project-controls {
      grid-template-columns: 1fr;
    }

    .sample-project-controls > .sample-button {
      width: 100%;
    }

    .sample-library-tray {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding: 0.2rem 0.15rem 0.5rem;
      scroll-snap-type: x proximity;
    }

    .sample-library-card {
      flex: 0 0 min(10.5rem, 72vw);
      scroll-snap-align: start;
    }

    .sample-inbox-tray {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding: 0.2rem 0.15rem 0.5rem;
      scroll-snap-type: x proximity;
    }

    .sample-inbox-card {
      flex: 0 0 9.5rem;
      scroll-snap-align: start;
    }

    .sample-placement-notice {
      align-items: stretch;
      flex-direction: column;
    }

    .sample-pad {
      border-radius: 0.58rem;
    }

    .sample-action-row,
    .sample-primary-actions {
      gap: 0.5rem;
    }

    .sample-button {
      padding-inline: 0.6rem;
      font-size: 0.78rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #btn-device-enable,
    #btn-device-use-channel,
    .ex-verify.ex-verify-idle,
    .ex-verify.ex-verify-waiting,
    .ex-verify.ex-verify-confirmed,
    /* M5 a11y: extend the rule to every remaining animated surface in
       this file -- the card hover lift/shadow, option/button tints, the
       JA toggle, and the chapter disclosure arrow -- so reduced-motion
       users get instant state changes everywhere, not only on the M4
       device surface. (M5 adds no new transitions of its own; the
       :focus-visible rings above are static outlines.) */
    .manual-card,
    .ex-deck-card,
    .ex-option,
    .ex-chapter-title::before,
    #btn-ja-toggle,
    #btn-ex-submit,
    #btn-ex-unsure,
    #btn-ex-grade-again,
    #btn-ex-grade-hard,
    #btn-ex-grade-good,
    #btn-ex-grade-easy,
    #btn-ex-recall-yes,
    #btn-ex-recall-no,
    #btn-ex-next,
    #btn-ex-restart,
    #btn-ex-hint,
    #btn-ex-find-submit,
    .btn-ex-confirm {
      transition: none;
    }

    .sample-pad.is-playing {
      animation: none;
      filter: brightness(1.25);
    }

    .sample-button:hover,
    .sample-button:focus-visible {
      transform: none;
    }

    /* The hover lift is a movement, not a state cue (the shadow change
       already marks hover) -- suppress it under reduced motion. */
    .manual-card:hover,
    .ex-deck-card:hover,
    .ex-deck-card:focus-visible {
      transform: none;
    }
  }
</style>
