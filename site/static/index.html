<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18794e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEXY ONE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<title>SEXY ONE — SXC-1 Trainer</title>
<!-- Module scripts defer execution until parsing completes. Keeping the loader
     in <head> lets phones discover its module graph while the inline styles are
     still being parsed, instead of beginning that network work at </body>. -->
<script type="module" src="./index.js"></script>
<style>
  /*
   * All visual styling for the SXC-1 Trainer lives here. The Haskell/Miso
   * application (compiled to WebAssembly) contributes markup only, mounted
   * by APPENDING <main id="app"> to <body> at runtime -- static body markup
   * (#boot-status, <noscript>) survives beside it. Before boot completes,
   * #boot-status is the only visible content.
   *
   * M1 DOM contract this file styles (identical on every route):
   *   #app > #sxc1-header        brand link (a.brand) + a route-dependent
   *                               breadcrumb
   *   #app > #sxc1-content-stats always [hidden]; never rendered visibly
   *   #app > ... one of:
   *     #sxc1-home                  p (blurb)
   *                                  aside#sxc1-phone-qr (laptop->phone QR)
   *                                    p.phone-qr-title, p.phone-qr-hint
   *                                    a.phone-qr-link > img#sxc1-phone-qr-img
   *                                    p.phone-qr-url > a
   *                                  ul.manual-list > li > a.manual-card
   *     #sxc1-toc                   section.toc-group > h2.toc-group-title
   *                                  + ol.toc-sections > li > a + span.toc-page
   *                                  (+ ul.toc-subs > li > a)
   *     #sxc1-page                  (+ class "ja-visible" when JA is shown)
   *                                  p.page-running-header?
   *                                  div.page-body#page-<n>
   *                                    figure.md-figure > figcaption
   *                                    blockquote.md-note
   *                                    div.table-wrap > table
   *                                    span.md-placeholder, code, a.page-ref
   *                                    ol[start], nested ul/ol
   *                                  figure#ja-panel > img#ja-image + figcaption?
   *                                  button#btn-ja-toggle
   *                                  nav.page-nav > a#btn-prev-page, a#btn-next-page
   *   #app > #sxc1-footer         p#sxc1-disclaimer
   *
   * Headings rendered inside a page carry id="h-<slug>" (styled generically
   * via .page-body h1..h6, no dedicated hook needed).
   *
   * M2 (exercise engine) and M3 (progress engine) each add their own DOM
   * surface, documented by their banner comments further down. M4 (live-
   * device verification) adds the surface below, styled by the last
   * section of this file:
   *   #app > #sxc1-device-state  always [hidden]; never rendered visibly
   *                               (hidden by the same rule as
   *                               #sxc1-content-stats above)
   *   inside article#sxc1-exercise, drills only, and only when Web MIDI
   *   is available -- never on quizzes or lookups, and a browser without
   *   Web MIDI renders none of it:
   *     section#ex-device           the device panel, a single column
   *       button#btn-device-enable    the ONLY control that ever requests
   *                                    MIDI permission; label tracks status
   *       p#device-status             one plain sentence, status-dependent
   *       select#sel-device-channel   MIDI channel 1..16
   *       p#device-ports              bound port names, or the
   *                                    "nothing detected" line
   *       button#btn-device-use-channel  shown only on a channel mismatch
   *   p.ex-verify (M2) gains exactly one state class per render:
   *     .ex-verify-idle             verification off or unsupported;
   *                                  keeps M2's bare .ex-verify look
   *     .ex-verify-waiting          armed and listening for the device
   *     .ex-verify-confirmed        this step was confirmed by the device
   */

  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1b1e24;
    --muted: #5b6270;
    --accent: #2f6fed;
    --accent-contrast: #ffffff;
    --danger: #c94b4b;
    --danger-bg: rgba(201, 75, 75, 0.12);
    --wizard-yes: #18794e;
    --wizard-yes-contrast: #ffffff;
    --wizard-no: #b42318;
    --wizard-no-contrast: #ffffff;
    --border: #d9dce2;
    --shadow: 0 10px 30px rgba(20, 24, 34, 0.08);

    --hover-bg: rgba(47, 111, 237, 0.08);
    --note-bg: rgba(47, 111, 237, 0.07);
    --code-bg: rgba(27, 30, 36, 0.06);
    --code-text: #b3261e;
    --table-head-bg: rgba(27, 30, 36, 0.035);
    --table-stripe: rgba(27, 30, 36, 0.028);
    --table-edge: rgba(20, 24, 34, 0.14);
    --ja-bg: #e7e9ee;
    --header-bg: rgba(244, 245, 247, 0.85);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --card-bg: #1d2027;
      --text: #eef0f4;
      --muted: #a2a9b6;
      --accent: #6f9bff;
      --accent-contrast: #0c0f14;
      --danger: #ff8383;
      --danger-bg: rgba(255, 131, 131, 0.14);
      --wizard-yes: #4fd1a0;
      --wizard-yes-contrast: #07130e;
      --wizard-no: #ff7b72;
      --wizard-no-contrast: #1a0807;
      --border: #30343d;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);

      --hover-bg: rgba(111, 155, 255, 0.14);
      --note-bg: rgba(111, 155, 255, 0.1);
      --code-bg: rgba(238, 240, 244, 0.09);
      --code-text: #ff9b8f;
      --table-head-bg: rgba(238, 240, 244, 0.06);
      --table-stripe: rgba(238, 240, 244, 0.045);
      --table-edge: rgba(0, 0, 0, 0.55);
      --ja-bg: #23262d;
      --header-bg: rgba(20, 22, 27, 0.85);
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  /* The document is a normal top-anchored reading page, not a centred
     flex box -- M0's counter card layout is replaced entirely. */
  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    line-height: 1.65;
  }

  #app {
    display: block;
    width: 100%;
  }

  #boot-status {
    display: grid;
    gap: 0.35rem;
    max-width: 32rem;
    margin: 3rem auto;
    text-align: center;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: var(--shadow);
  }

  #boot-status strong {
    color: var(--text);
    font-size: 1.15rem;
    letter-spacing: 0.04em;
  }

  #boot-status-hint {
    font-size: 0.78rem;
  }

  #boot-status.boot-error {
    color: var(--danger);
    border-color: var(--danger);
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #boot-status[hidden] {
    display: none;
  }

  #sxc1-network-status {
    position: fixed;
    z-index: 60;
    top: calc(3.25rem + env(safe-area-inset-top, 0px));
    right: max(0.75rem, env(safe-area-inset-right, 0px));
    max-width: min(22rem, calc(100vw - 1.5rem));
    margin: 0;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--muted);
    box-shadow: var(--shadow);
    font-size: 0.8rem;
    line-height: 1.35;
  }

  #sxc1-network-status[hidden] {
    display: none;
  }

  noscript {
    display: block;
    max-width: 26rem;
    margin: 2rem auto;
    text-align: center;
    color: var(--danger);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
  }

  /* -------------------------------------------------------------------
     Header: sticky brand + breadcrumb. Capped so it never costs more
     than ~3.5rem of vertical space on a phone; a long breadcrumb scrolls
     horizontally inside the bar instead of wrapping to a second line.
     ------------------------------------------------------------------- */

  #sxc1-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    min-height: 2.75rem;
    max-height: 3.5rem;
    overflow: hidden;
    padding: 0.55rem 1.1rem;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  #sxc1-header a.brand {
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    /* M5 a11y sweep: enlarge the tap target (the text itself is ~25px
       tall) without growing the capped header -- padding stays inside
       the existing min/max-height envelope. */
    padding: 0.5rem 0;
  }

  #sxc1-header a.brand:hover {
    color: var(--accent);
  }

  /* Everything in the header besides the brand link is treated as the
     breadcrumb, whatever element the app wraps it in. */
  #sxc1-header > *:not(.brand) {
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #sxc1-header > *:not(.brand) a {
    color: var(--muted);
    text-decoration: none;
    /* M5 a11y sweep: the breadcrumb's manual-title link was a ~15px-tall
       tap target; block padding on an inline-block grows the hit area
       inside the header strip without changing the strip's height. */
    display: inline-block;
    padding: 0.5rem 0;
  }

  #sxc1-header > *:not(.brand) a:hover,
  #sxc1-header > *:not(.brand) a:focus-visible {
    color: var(--accent);
    text-decoration: underline;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 0.2rem;
  }

  /* M5 a11y: the programmatic focus targets (tabindex="-1" -- the
     runner heading, each drill step, and the completion summary; see
     site/app/View/Exercise.hs and Main.hs's advance-focus wiring) get
     the same keyboard focus ring as every link/button, so a keyboard
     user always sees where an advance landed them. :focus-visible keeps
     the ring away from mouse/device-confirm flows. */
  #ex-title:focus-visible,
  .ex-step:focus-visible,
  #ex-summary:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 0.2rem;
  }

  /* #sxc1-content-stats carries the machine-readable corpus JSON and must
     never render, under any circumstance. */
  #sxc1-content-stats,
  #sxc1-device-state,
  [hidden] {
    display: none !important;
  }

  /* -------------------------------------------------------------------
     Shared reading-column width for single-column sections.
     ------------------------------------------------------------------- */

  #sxc1-home,
  #sxc1-toc,
  #sxc1-footer {
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  /* -------------------------------------------------------------------
     Home: visible QR, then one green learning path and one red Sample Lab
     path. Browsing/progress details stay in a quieter disclosure below.
     ------------------------------------------------------------------- */

  #sxc1-home > p {
    color: var(--muted);
    margin: 0 0 1.5rem;
  }

  #sxc1-primary-training {
    margin: 0;
  }

  .wizard-actions {
    display: grid;
    gap: 0.85rem;
    margin-top: 1rem;
  }

  .primary-training-action {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.3rem;
    min-height: 4.5rem;
    padding: 1rem 1.2rem;
    border: 1px solid var(--accent);
    border-radius: 0.8rem;
    background: var(--accent);
    color: var(--accent-contrast);
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  .wizard-choice {
    min-height: 4.5rem;
    border-radius: 0.8rem;
    box-shadow: var(--shadow);
    font-weight: 700;
  }

  .wizard-yes {
    border-color: var(--wizard-yes) !important;
    background: var(--wizard-yes) !important;
    color: var(--wizard-yes-contrast) !important;
  }

  a.wizard-no,
  button.wizard-no,
  details.wizard-no > summary {
    border-color: var(--wizard-no) !important;
    background: var(--wizard-no) !important;
    color: var(--wizard-no-contrast) !important;
  }

  a.wizard-no {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.2rem;
    text-align: center;
    text-decoration: none;
  }

  .wizard-choice:hover,
  .wizard-choice:focus-visible,
  details.wizard-choice > summary:hover,
  details.wizard-choice > summary:focus-visible {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .primary-training-action:hover,
  .primary-training-action:focus-visible {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .primary-training-action strong {
    font-size: 1.05rem;
  }

  .primary-training-card {
    font-size: 0.85rem;
    opacity: 0.88;
  }

  .home-disclosure {
    margin: 0.85rem 0 0;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  .home-disclosure > summary {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    min-height: 44px;
    padding: 0.7rem 1rem;
    cursor: pointer;
    list-style: none;
    font-weight: 700;
  }

  #sxc1-browse-library > summary {
    min-height: 4.5rem;
    border-radius: 0.8rem;
  }

  #sxc1-browse-library[open] {
    background: var(--card-bg);
  }

  #sxc1-browse-library[open] > summary {
    border-radius: 0.8rem 0.8rem 0 0;
  }

  .home-disclosure > summary::-webkit-details-marker {
    display: none;
  }

  .home-disclosure > summary::before {
    content: "\25B8";
    color: var(--muted);
    transition: transform 0.12s ease;
  }

  .home-disclosure[open] > summary::before {
    transform: rotate(90deg);
  }

  .home-disclosure > summary:hover,
  .home-disclosure > summary:focus-visible {
    color: var(--accent);
  }

  .home-disclosure[open] > summary {
    border-bottom: 1px solid var(--border);
  }

  .home-disclosure > :not(summary) {
    margin-right: 1rem;
    margin-left: 1rem;
  }

  /* Author rules such as #sxc1-phone-qr { display:flex } can otherwise
     outrank Chromium's user-agent rule for closed details content. */
  .home-disclosure:not([open]) > :not(summary) {
    display: none !important;
  }

  .home-disclosure > .manual-list {
    margin-top: 1rem;
  }

  /* QR handoff: front and center when the site is open on a laptop. The
     modules stay pure black on white (forced below) so a phone camera
     can read them under dark mode or a dim room. Keep the handoff visible
     at every viewport width: phones and narrow browser windows are also
     common places to discover and share the site. */
  #sxc1-phone-qr {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.5rem;
    margin-bottom: 1.25rem;
    padding: 1.25rem 1rem 1.35rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    text-align: center;
  }

  #sxc1-phone-qr .phone-qr-title {
    margin: 0;
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
  }

  #sxc1-phone-qr .phone-qr-hint {
    margin: 0 0 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  #sxc1-phone-qr .phone-qr-link {
    display: inline-block;
    /* qr-phone.svg has a two-module internal border. At its rendered
       size this extra white padding takes the effective quiet zone past
       the four modules QR readers expect. */
    padding: 1rem;
    border-radius: 0.5rem;
    background: #ffffff;
    line-height: 0;
  }

  #sxc1-phone-qr-img {
    display: block;
    width: 14rem;
    height: 14rem;
    max-width: 100%;
  }

  #sxc1-phone-qr .phone-qr-url {
    margin: 0.35rem 0 0;
    font-size: 0.8rem;
    word-break: break-all;
  }

  #sxc1-phone-qr .phone-qr-url a {
    color: var(--accent);
    text-decoration: none;
  }

  #sxc1-phone-qr .phone-qr-url a:hover,
  #sxc1-phone-qr .phone-qr-url a:focus-visible {
    text-decoration: underline;
  }

  .manual-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.85rem;
  }

  .manual-card {
    display: block;
    min-height: 44px;
    padding: 1rem 1.15rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  .manual-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(20, 24, 34, 0.14);
  }

  .manual-card strong {
    display: block;
    font-size: 1.05rem;
    margin-bottom: 0.2rem;
  }

  .manual-card small {
    color: var(--muted);
  }

  /* -------------------------------------------------------------------
     Manual contents (table of contents).
     ------------------------------------------------------------------- */

  .toc-group {
    margin: 0 0 2.25rem;
  }

  .toc-group-title {
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 0 0 0.75rem;
    padding-bottom: 0.45rem;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
  }

  .toc-sections {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .toc-sections > li {
    border-bottom: 1px solid var(--border);
  }

  .toc-sections > li > a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 44px;
    padding: 0.6rem 0.3rem;
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }

  .toc-sections > li > a:hover,
  .toc-sections > li > a:focus-visible {
    background: var(--hover-bg);
    border-radius: 0.4rem;
  }

  .toc-page {
    flex: 0 0 auto;
    color: var(--muted);
    font-weight: 400;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .toc-subs {
    list-style: none;
    margin: 0 0 0.4rem 1rem;
    padding: 0 0 0 0.85rem;
    border-left: 2px solid var(--border);
  }

  .toc-subs li a {
    display: flex;
    align-items: center;
    /* M5 a11y sweep: 40px -> 44px, the tap-target floor every other
       primary action in this file already meets. */
    min-height: 44px;
    padding: 0.35rem 0.3rem;
    color: var(--muted);
    font-size: 0.92rem;
    text-decoration: none;
  }

  .toc-subs li a:hover,
  .toc-subs li a:focus-visible {
    color: var(--accent);
    background: var(--hover-bg);
    border-radius: 0.4rem;
  }

  /* -------------------------------------------------------------------
     Page reader: header/body/JA-panel/toggle/nav on a CSS grid. One
     column by default; at >= 60rem, when the article also carries
     "ja-visible", the panel becomes a sticky second column beside the
     text. Below 60rem (or when JA is off) everything simply stacks full
     width in document order -- that is how "beside (or instead of)"
     becomes a CSS decision, never a Haskell one.
     ------------------------------------------------------------------- */

  #sxc1-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.5rem;
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 4rem;
  }

  .page-running-header {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .page-body {
    min-width: 0;
  }

  .page-body > * {
    margin: 0 0 1rem;
  }

  .page-body > *:first-child {
    margin-top: 0;
  }

  .page-body > *:last-child {
    margin-bottom: 0;
  }

  .page-body h1,
  .page-body h2,
  .page-body h3,
  .page-body h4,
  .page-body h5,
  .page-body h6 {
    margin-top: 1.5rem;
    margin-bottom: 0.55rem;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .page-body h1 { font-size: 1.75rem; }
  .page-body h2 { font-size: 1.4rem; }
  .page-body h3 { font-size: 1.15rem; }
  .page-body h4 { font-size: 1rem; }
  .page-body h5,
  .page-body h6 { font-size: 0.92rem; color: var(--muted); }

  .page-body p {
    margin: 0 0 1rem;
  }

  .page-body a {
    color: var(--accent);
  }

  .page-body ul,
  .page-body ol,
  blockquote.md-note ul,
  blockquote.md-note ol {
    margin: 0 0 1rem;
    padding-left: 1.5rem;
  }

  .page-body li {
    margin-bottom: 0.4rem;
    padding-left: 0.2rem;
  }

  .page-body li::marker,
  blockquote.md-note li::marker {
    color: var(--muted);
    font-weight: 600;
  }

  /* A "titled step" (guide-book pp.50-54: a list item whose own
     marker-line text is itself heading-shaped -- a heading marker on the
     same line as the list marker) renders its title as a real heading
     element -- the first child of the <li> -- so the h1..h4 rule above
     would otherwise push it down by its usual margin-top and detach it
     from the step number sitting beside it. Zero it here, the same way
     "blockquote.md-note > *:first-child" already does for a nested
     heading inside a "Tip" callout. */
  .page-body li > h1,
  .page-body li > h2,
  .page-body li > h3,
  .page-body li > h4 {
    margin-top: 0;
    margin-bottom: 0.4rem;
  }

  .page-body ul ul,
  .page-body ul ol,
  .page-body ol ul,
  .page-body ol ol {
    margin-top: 0.4rem;
    margin-bottom: 0.2rem;
    padding-left: 1.35rem;
  }

  /* ol[start] must keep displaying its literal start number -- default
     browser decimal counting already honours [start]; this rule only
     guards against list-style ever being reset elsewhere. */
  .page-body ol[start] {
    list-style-type: decimal;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 0.15em 0.4em;
    border-radius: 0.3em;
    white-space: nowrap;
    word-break: keep-all;
  }

  blockquote.md-note {
    margin: 1.25rem 0;
    padding: 0.9rem 1.1rem;
    border-left: 4px solid var(--accent);
    background: var(--note-bg);
    border-radius: 0 0.6rem 0.6rem 0;
    color: var(--text);
  }

  blockquote.md-note > *:first-child {
    margin-top: 0;
  }

  blockquote.md-note > *:last-child {
    margin-bottom: 0;
  }

  blockquote.md-note p {
    margin: 0 0 0.6rem;
  }

  blockquote.md-note figure.md-figure {
    margin: 0.75rem 0;
  }

  figure.md-figure {
    margin: 1.25rem 0;
    padding: 0.9rem 1.05rem;
    border: 1px dashed var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
  }

  figure.md-figure figcaption {
    font-style: italic;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--muted);
  }

  figure.md-figure figcaption::before {
    content: "Figure not reproduced \2014\0020";
    font-style: normal;
    font-weight: 600;
  }

  span.md-placeholder {
    display: inline-block;
    font-style: italic;
    font-size: 0.92em;
    color: var(--muted);
    background: var(--note-bg);
    padding: 0.05em 0.4em;
    border-radius: 0.3em;
  }

  a.page-ref {
    color: var(--accent);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.15em;
  }

  a.page-ref:hover {
    filter: brightness(1.15);
  }

  /* Tables: the mobile risk. The wrapper scrolls; the document body
     never does. */
  div.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 1.25rem 0;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    box-shadow: inset -14px 0 10px -10px var(--table-edge);
  }

  div.table-wrap table {
    border-collapse: collapse;
    width: 100%;
    min-width: 26rem;
    font-size: 0.88rem;
  }

  div.table-wrap th,
  div.table-wrap td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }

  div.table-wrap thead th {
    background: var(--table-head-bg);
    border-bottom: 2px solid var(--border);
    font-weight: 700;
    white-space: nowrap;
  }

  div.table-wrap tbody tr:nth-child(even) {
    background: var(--table-stripe);
  }

  /* -------------------------------------------------------------------
     JA panel: neutral background so a page render never blends in, plus
     a light border. Sticky beside the text only in the wide 2-column
     layout below.
     ------------------------------------------------------------------- */

  #ja-panel {
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--ja-bg);
    overflow: hidden;
  }

  #ja-panel a {
    display: block;
    line-height: 0;
  }

  #ja-image {
    width: 100%;
    height: auto;
    display: block;
    background: var(--ja-bg);
    border-bottom: 1px solid var(--border);
  }

  #ja-panel figcaption {
    padding: 0.6rem 0.85rem;
    font-size: 0.8rem;
    text-align: center;
    color: var(--muted);
  }

  #btn-ja-toggle {
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    padding: 0.65rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: transparent;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease;
  }

  #btn-ja-toggle:hover {
    background: var(--hover-bg);
  }

  .page-nav {
    display: flex;
    gap: 1rem;
  }

  #btn-prev-page,
  #btn-next-page {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.65rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
    text-align: center;
  }

  #btn-prev-page:hover,
  #btn-next-page:hover {
    background: var(--hover-bg);
    border-color: var(--accent);
  }

  /* -------------------------------------------------------------------
     Footer / disclaimer.
     ------------------------------------------------------------------- */

  #sxc1-footer {
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }

  #sxc1-disclaimer {
    margin: 1.5rem 0 0;
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--muted);
    text-align: center;
  }

  /* -------------------------------------------------------------------
     Wide-viewport page grid: text column capped for reading comfort,
     JA panel a sticky sidebar spanning the full height of the page's
     rows (running header through prev/next nav). Named areas (not
     `grid-row: 1 / -1`) because there is no `grid-template-rows`, so a
     negative row line has no fixed implicit-grid end to resolve
     against; named areas give the JA column an explicit, unambiguous
     span across exactly these four rows regardless of how tall
     .page-body's own content makes the "body" row. The running header
     is optional per page -- an unused "header" cell is harmless.
     ------------------------------------------------------------------- */
  @media (min-width: 60rem) {
    #sxc1-page.ja-visible {
      max-width: 78rem;
      grid-template-columns: minmax(0, 44rem) minmax(18rem, 28rem);
      grid-template-areas:
        "header ja"
        "body   ja"
        "toggle ja"
        "nav    ja";
      column-gap: 2.5rem;
    }

    #sxc1-page.ja-visible .page-running-header { grid-area: header; }
    #sxc1-page.ja-visible .page-body { grid-area: body; }
    #sxc1-page.ja-visible #btn-ja-toggle { grid-area: toggle; }
    #sxc1-page.ja-visible .page-nav { grid-area: nav; }

    #sxc1-page.ja-visible #ja-panel {
      grid-area: ja;
      align-self: start;
      position: sticky;
      top: calc(3.5rem + 1.5rem);
    }
  }

  @media (max-width: 30rem) {
    .page-nav {
      flex-direction: column;
    }

    /* M5 a11y sweep finding (pinned by the browser suite's mobile
       sweep): on manual routes at phone widths the header's fixed
       pieces (brand ~197px + review badge + JA-first pill + gaps +
       padding) exceed the viewport, and the overflow:hidden bar CLIPPED
       #btn-ja-first clean off the screen -- measured right edge 446px
       on a 360px device, i.e. the toggle was unreachable by touch. Two
       repairs: the brand may now shrink and ellipsize (it is a
       decorative home link; the pills are controls), and the bar
       itself becomes a horizontal scroll strip instead of a clip, so
       anything that still cannot fit (320px with a long crumb) can be
       swiped to -- the same pattern the breadcrumb strip inside it
       already uses. Keyboard focus is unaffected either way: focusing
       a clipped element scrolls its container. */
    #sxc1-header {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    #sxc1-header a.brand {
      flex: 0 1 auto;
      min-width: 3.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }

  /* =====================================================================
     M2 exercise engine. Purely additive below this line -- nothing above
     is restructured or reinterpreted. #boot-status, the <noscript>
     block, the not affiliated with Casio disclaimer text (#sxc1-footer >
     #sxc1-disclaimer, owned by site/app/View/Pages.hs) and the
     ./index.js module script tag are all exactly as M0/M1 left them.
     The Haskell contributes markup only; this is the DOM/CSS contract it
     targets (identical on every route beside M1's own
     #sxc1-content-stats):

       #app > #sxc1-exercise-stats  always [hidden]; machine-readable JSON
       #app > #sxc1-event-log       always [hidden]; machine-readable JSON

       "#/x"              #sxc1-exercise-index
                             section.ex-chapter > h2.ex-chapter-title
                               ul.ex-deck-list > li > a.ex-deck-card
                                 span.ex-deck-title, span.ex-deck-count

       "#/x/<deck>"       #sxc1-deck
                             h1#ex-deck-title, p#ex-deck-summary
                             ol.ex-list > li > a.ex-link
                               span.ex-kind.kind-quiz|kind-drill|kind-lookup
                               span.ex-title

       "#/x/<deck>/<ex>"  article#sxc1-exercise.exercise.kind-<kind>
                             h1#ex-title, p#ex-progress ("N / M"), #ex-stem
                             quiz choice: fieldset#ex-options containing
                                          label.ex-option + positional
                                          input#opt-a/#opt-b/...; then the
                                          two-action #ex-choice-actions,
                                          replaced after checking by
                                          #ex-grade-actions (Again/Hard or
                                          Good/Easy)
                             legacy recall (fixtures/back-compat only):
                                          #ex-recall-flow with stable
                                          #ex-recall-answer-region,
                                          #ex-recall-feedback-region and
                                          #ex-recall-actions containing
                                          button#btn-ex-recall-yes +
                                          button#btn-ex-recall-no
                             drill:       ol#ex-steps > li.ex-step
                                            div.ex-step-instruction
                                            p.ex-step-check
                                            p.ex-verify (muted, secondary --
                                            a not-yet-active device check,
                                            never an error or a CTA)
                                            button.btn-ex-confirm
                             lookup:      p#ex-find-task, input#ex-find-input,
                                          button#btn-ex-find-submit,
                                          p#ex-elapsed ("M:SS", monospace)
                             shared:      button#btn-ex-hint,
                                          ul#ex-hints > li.ex-hint
                                          p#ex-feedback.correct|.incorrect
                                            (role="status")
                                          #ex-note
                                          ul#ex-cites > li > a.cite
                                          button#btn-ex-next,
                                          button#btn-ex-restart
                                          section#ex-summary
     ===================================================================== */

  :root {
    --success: #1f9d55;
    --success-contrast: #ffffff;
    --success-bg: rgba(31, 157, 85, 0.12);
    --incorrect-bg: rgba(201, 75, 75, 0.12);
    --kind-quiz: #6f52d8;
    --kind-quiz-bg: rgba(111, 82, 216, 0.14);
    --kind-drill: #1f8f6f;
    --kind-drill-bg: rgba(31, 143, 111, 0.14);
    --kind-lookup: #a8720f;
    --kind-lookup-bg: rgba(168, 114, 15, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --success: #4ade80;
      --success-contrast: #0c0f14;
      --success-bg: rgba(74, 222, 128, 0.16);
      --incorrect-bg: rgba(255, 131, 131, 0.14);
      --kind-quiz: #b9a4ff;
      --kind-quiz-bg: rgba(185, 164, 255, 0.16);
      --kind-drill: #5eead4;
      --kind-drill-bg: rgba(94, 234, 212, 0.14);
      --kind-lookup: #ffcf6e;
      --kind-lookup-bg: rgba(255, 207, 110, 0.16);
    }
  }

  /* Belt-and-suspenders: the two machine-readable JSON carriers must
     never be revealable even if something targets them specifically
     rather than relying only on the generic [hidden] rule above. */
  #sxc1-exercise-stats,
  #sxc1-event-log {
    display: none !important;
  }

  /* -------------------------------------------------------------------
     Exercise index ("#/x"): chapters of deck cards. Long titles/labels
     anywhere in this section wrap instead of widening the page.
     ------------------------------------------------------------------- */

  #sxc1-exercise-index,
  #sxc1-deck,
  #sxc1-exercise {
    overflow-wrap: anywhere;
  }

  #sxc1-exercise-index {
    max-width: 60rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  .ex-chapter {
    margin: 0 0 2.5rem;
  }

  .ex-chapter-title {
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.005em;
    margin: 0 0 0.9rem;
    padding-bottom: 0.45rem;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
  }

  .ex-deck-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
  }

  @media (min-width: 34rem) {
    .ex-deck-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (min-width: 54rem) {
    .ex-deck-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  .ex-deck-card {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-height: 44px;
    padding: 1rem 1.15rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  .ex-deck-card:hover,
  .ex-deck-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(20, 24, 34, 0.14);
  }

  .ex-deck-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
  }

  .ex-deck-count {
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* -------------------------------------------------------------------
     Deck page ("#/x/<deck>"): the ordered exercise list.
     ------------------------------------------------------------------- */

  #sxc1-deck {
    max-width: 44rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 3rem;
  }

  #ex-deck-title {
    margin: 0 0 0.5rem;
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  #ex-deck-summary {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }

  .ex-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .ex-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-height: 44px;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
  }

  .ex-link:hover,
  .ex-link:focus-visible {
    background: var(--hover-bg);
    border-color: var(--accent);
  }

  .ex-kind {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.5rem;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .ex-kind.kind-quiz {
    background: var(--kind-quiz-bg);
    color: var(--kind-quiz);
  }

  .ex-kind.kind-drill {
    background: var(--kind-drill-bg);
    color: var(--kind-drill);
  }

  .ex-kind.kind-lookup {
    background: var(--kind-lookup-bg);
    color: var(--kind-lookup);
  }

  .ex-title {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 600;
  }

  /* -------------------------------------------------------------------
     Runner ("#/x/<deck>/<ex>"): stem, progress, and per-kind body.
     ------------------------------------------------------------------- */

  #sxc1-exercise {
    max-width: 38rem;
    margin: 0 auto;
    padding: 1.75rem clamp(1rem, 4vw, 2rem) 4rem;
  }

  /* Block flow, not a flex column: #ex-find-input and #btn-ex-find-submit
     are flat siblings in the DOM contract (no wrapper element) and must
     sit beside each other as ordinary inline-level boxes, which a
     column flex container's implicit one-child-per-row layout would
     prevent regardless of either element's own width. */
  #sxc1-exercise > * {
    margin: 0 0 1.25rem;
  }

  #sxc1-exercise > *:first-child {
    margin-top: 0;
  }

  #sxc1-exercise > *:last-child {
    margin-bottom: 0;
  }

  #ex-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  #ex-progress {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #ex-stem {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text);
  }

  /* Visual-source cards: the cited manual scan is part of the question,
     not an answer hidden in a separate reader route. Page 10 is cropped
     to the numbered five-view panel diagram; page 11 keeps the taller
     mode map. Clicking either opens the complete source page. */
  #ex-source-figure {
    margin: 0 0 1rem;
  }

  .exercise-source-frame {
    display: block;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: #ffffff;
    box-shadow: var(--shadow);
    line-height: 0;
  }

  .figure-guide-book-10 .exercise-source-frame {
    aspect-ratio: 1.4;
  }

  .figure-guide-book-11 .exercise-source-frame {
    aspect-ratio: 1.03;
  }

  #ex-source-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  #ex-source-figure figcaption {
    margin-top: 0.45rem;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }

  .exercise-source-caption {
    color: inherit;
  }

  #ex-stem > *:first-child {
    margin-top: 0;
  }

  #ex-stem > *:last-child {
    margin-bottom: 0;
  }

  /* Legacy open-recall fixtures/backwards compatibility. Live M11 course
     content has zero Recall prompts; authored flashcards use Choice. */
  .mode-recall #ex-stem {
    min-height: 8rem;
    padding: 1.35rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    background: var(--card-bg);
    box-shadow: inset 0 0.3rem var(--accent), var(--shadow);
    font-size: 1.08rem;
    line-height: 1.55;
  }

  .mode-recall #ex-recall-answer-region:not(:empty) {
    margin-top: 1rem;
  }

  .mode-recall #ex-answer {
    border-left: 0.3rem solid var(--wizard-yes);
    box-shadow: var(--shadow);
  }

  .mode-recall #ex-recall-feedback-region:not(:empty) {
    margin-top: 1rem;
  }

  /* Quiz choice mode: compact selectable cards. They are native radio/
     checkbox controls, not a wall of action buttons; the only buttons in
     the decision surface are the current pair below the fieldset. */

  #ex-options {
    margin: 1rem 0;
    padding: 0;
    border: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  #ex-options > legend {
    padding: 0;
    margin-bottom: 0.55rem;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .ex-option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 44px;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-size: 0.98rem;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .ex-option:hover {
    background: var(--hover-bg);
  }

  #ex-options.is-evaluated .ex-option {
    cursor: default;
  }

  #ex-options.is-evaluated .ex-option:hover {
    background: var(--card-bg);
  }

  .ex-option > input {
    width: 1.15rem;
    height: 1.15rem;
    margin: 0;
    flex: 0 0 auto;
    accent-color: var(--accent);
  }

  .ex-option > span {
    min-width: 0;
  }

  /* Selection is never colour-only: the border switches to the accent
     colour AND a check mark appears, on top of the colour change. */
  .ex-option.is-selected {
    border-color: var(--accent);
    background: var(--hover-bg);
    font-weight: 700;
  }

  .ex-option.is-selected::after {
    content: "\2713";
    margin-left: auto;
    flex: 0 0 auto;
    color: var(--accent);
    font-weight: 700;
  }

  .ex-option.is-correct {
    border-color: var(--success);
    background: var(--success-bg);
  }

  .ex-option.is-correct::after {
    content: "\2713";
    margin-left: auto;
    color: var(--success);
    font-weight: 800;
  }

  .ex-option.is-wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }

  #ex-choice-actions,
  #ex-grade-actions {
    margin-top: 1rem;
  }

  /* Shared action buttons. Primary (filled) by default; the quieter
     follow-up actions (hint, missed, restart) are outlined so they never
     compete with the one action that moves the learner forward. */
  #btn-ex-submit,
  #btn-ex-unsure,
  #btn-ex-grade-again,
  #btn-ex-grade-hard,
  #btn-ex-grade-good,
  #btn-ex-grade-easy,
  #btn-ex-recall-yes,
  #btn-ex-recall-no,
  #btn-ex-next,
  #btn-ex-restart,
  #btn-ex-hint,
  #btn-ex-find-submit,
  .btn-ex-confirm {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.7rem 1.3rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: var(--accent);
    color: var(--accent-contrast);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.12s ease, background 0.12s ease;
  }

  #btn-ex-submit:hover,
  #btn-ex-grade-hard:hover,
  #btn-ex-grade-easy:hover,
  #btn-ex-recall-yes:hover,
  #btn-ex-next:hover,
  #btn-ex-find-submit:hover,
  .btn-ex-confirm:hover {
    filter: brightness(1.08);
  }

  #btn-ex-submit:disabled {
    cursor: not-allowed;
    filter: none;
    opacity: 0.5;
  }

  /* These are each the one standalone call to action on their own line,
     so (unlike #btn-ex-find-submit, which sits beside #ex-find-input)
     they run the full measure for an easy, unambiguous tap target. */
  #btn-ex-submit,
  #btn-ex-unsure,
  #btn-ex-grade-again,
  #btn-ex-grade-hard,
  #btn-ex-grade-good,
  #btn-ex-grade-easy,
  #btn-ex-recall-yes,
  #btn-ex-recall-no,
  #btn-ex-next,
  #btn-ex-restart,
  #btn-ex-hint,
  .btn-ex-confirm {
    display: flex;
    width: 100%;
  }

  #btn-ex-recall-no,
  #btn-ex-restart,
  #btn-ex-hint {
    background: transparent;
    color: var(--accent);
  }

  #btn-ex-recall-no:hover,
  #btn-ex-unsure:hover,
  #btn-ex-grade-again:hover,
  #btn-ex-grade-good:hover,
  #btn-ex-restart:hover,
  #btn-ex-hint:hover {
    background: var(--hover-bg);
  }

  #ex-answer {
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
  }

  /* Drill steps: numbered by the browser's own <ol> markers. */

  #ex-steps {
    padding-left: 1.4rem;
  }

  #ex-steps > .ex-step::marker {
    color: var(--muted);
    font-weight: 700;
  }

  .ex-step {
    padding-left: 0.3rem;
    margin-bottom: 1.1rem;
  }

  .ex-step:last-child {
    margin-bottom: 0;
  }

  .ex-step-instruction {
    margin: 0 0 0.4rem;
    color: var(--text);
  }

  /* Visually distinct from the instruction above it: a small labelled
     card rather than a plain paragraph, so "how you know it worked"
     reads as a separate, checkable claim. */
  .ex-step-check {
    margin: 0 0 0.4rem;
    padding: 0.55rem 0.8rem;
    border-left: 3px solid var(--accent);
    border-radius: 0 0.4rem 0.4rem 0;
    background: var(--note-bg);
    color: var(--text);
    font-size: 0.92rem;
  }

  /* A not-yet-active device check (M4 wires it up later). Muted and
     secondary on purpose -- it must never read as an error or a call to
     action, so no accent colour and no background tint. */
  .ex-verify {
    margin: 0;
    padding: 0.4rem 0.8rem;
    border-left: 3px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
  }

  /* Lookup. */

  #ex-find-task {
    margin: 0 0 0.75rem;
    color: var(--text);
  }

  #ex-find-input {
    display: inline-block;
    width: 8rem;
    max-width: 100%;
    min-height: 44px;
    margin: 0 0.6rem 0.6rem 0;
    padding: 0.6rem 0.8rem;
    vertical-align: middle;
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    background: var(--card-bg);
    color: var(--text);
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  #ex-find-input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  #btn-ex-find-submit {
    vertical-align: middle;
  }

  #ex-elapsed {
    margin: 0.6rem 0 0;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  /* Hints: de-emphasised, progressively revealed. */

  #ex-hints-disclosure {
    margin-top: 0.9rem;
    border: 1px dashed var(--border);
    border-radius: 0.6rem;
    background: var(--note-bg);
  }

  #btn-ex-hint {
    width: 100%;
    padding: 0.65rem 1rem;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    list-style-position: inside;
  }

  #ex-hints-disclosure[open] #btn-ex-hint {
    border-bottom: 1px dashed var(--border);
  }

  #ex-hints {
    margin: 0;
    list-style: none;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .ex-hint {
    padding: 0.55rem 0.8rem;
    border: 1px dashed var(--border);
    border-radius: 0.5rem;
    background: var(--note-bg);
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }

  /* Feedback: never colour-only -- a symbol precedes the text and the
     weight is already bold. */

  #ex-feedback {
    padding: 0.75rem 1rem;
    border-radius: 0.6rem;
    font-weight: 700;
    line-height: 1.5;
  }

  #ex-feedback::before {
    margin-right: 0.4rem;
    font-weight: 700;
  }

  #ex-feedback.correct {
    background: var(--success-bg);
    color: var(--success);
  }

  #ex-feedback.correct::before {
    content: "\2713";
  }

  #ex-feedback.incorrect {
    background: var(--incorrect-bg);
    color: var(--danger);
  }

  #ex-feedback.incorrect::before {
    content: "\2715";
  }

  #ex-note {
    padding: 0.9rem 1.1rem;
    border-left: 4px solid var(--accent);
    border-radius: 0 0.6rem 0.6rem 0;
    background: var(--note-bg);
    color: var(--text);
  }

  #ex-note > *:first-child {
    margin-top: 0;
  }

  #ex-note > *:last-child {
    margin-bottom: 0;
  }

  #ex-cites {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  /* Visually distinct from ordinary body links: a leading arrow glyph
     (matching figure.md-figure figcaption's existing hex-escape-glyph
     convention) as well as the bold weight, so a citation reads at a
     glance as a jump into the manual rather than a same-page link. */
  a.cite {
    color: var(--accent);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.15em;
  }

  a.cite::before {
    content: "\2192\0020";
    font-weight: 700;
  }

  a.cite:hover {
    filter: brightness(1.15);
  }

  #ex-summary {
    margin-top: 0.5rem;
    padding: 1.25rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    color: var(--text);
  }

  #ex-summary .wizard-actions {
    margin-bottom: 0;
  }

  #ex-summary > *:first-child {
    margin-top: 0;
  }

  #ex-summary > *:last-child {
    margin-bottom: 0;
  }

  /* =====================================================================
     M3 progress engine (briefs/M3-manifest.json, task "progress-ui").
     Purely additive again -- nothing above is restructured. New DOM/CSS
     surface, identical on every route unless noted:

       #sxc1-header > #sxc1-review-badge   nav-wide due-count badge
       #sxc1-header > #btn-ja-first        manual routes only (TOC + page)
       #sxc1-header > #btn-ui-lang         every route (M6 W2: the JA/EN
                                           UI-language toggle -- same
                                           .nav-toggle pill system)

       "#/" (home):
         aside#sxc1-phone-qr (always visible)
         #sxc1-wizard-actions (exactly two primary choices after deferred
                              Sample Lab enhancement)
           #sxc1-primary-training > a#btn-primary-training.wizard-yes
           a#btn-sample-lab.wizard-no -> #/samples
         details#sxc1-browse-library.home-disclosure
             (course outline, manuals, and the two disclosures below)
             details#sxc1-study-details (review, continue, streak)
             details#sxc1-progress-data (export/import/wipe)
         #sxc1-corrupt-banner.progress-banner?  (state == "corrupt")
           #sxc1-corrupt-raw (readonly textarea)
         #sxc1-review-queue > ol.queue-list > li.queue-item > a
           span.queue-deck, span.queue-ex, span.queue-due
           (or, when empty, a.deck-card[data-tier] "start the next deck")
         #sxc1-continue > a (or a.deck-card[data-tier])
         #sxc1-streak
         #sxc1-retired-note?                    (retired > 0)
         #sxc1-progress-tools
           details#sxc1-progress-backup.progress-flow
             button#btn-progress-export -> replaced after export by
             #sxc1-progress-passport > .progress-file-actions >
               button#btn-progress-download, button#btn-progress-share
           details#sxc1-progress-restore.progress-flow
             #sxc1-import-file-shell > input#sxc1-import-file
             form#sxc1-import-form > textarea#sxc1-import-input,
               p#sxc1-import-preview, button#btn-progress-import[type=submit]
           details#sxc1-progress-reset.progress-flow
             button#btn-progress-wipe -> replaced by
             button#btn-progress-wipe-confirm[hidden]

       "#/x" deck cards and each deck page's own info block both carry
       .deck-card[data-tier] > span.tier-badge.tier-<tier>,
                                span.deck-progress, span.deck-requires?
       "#/x" chapters are <details class="ex-chapter"> so the course
       does not become a flat wall on a phone; <summary class=
       "ex-chapter-title"> carries a span.chapter-progress.
     ===================================================================== */

  #sxc1-header > #sxc1-review-badge,
  #sxc1-header > #btn-ja-first,
  #sxc1-header > #btn-ui-lang {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    /* M5 a11y sweep: 1.7rem (~27px) -> 2.25rem (36px) tap height --
       the most the capped 3.5rem header can give these pills without
       clipping; the 44px floor applies to the in-content primary
       actions, which all already meet it. */
    min-height: 2.25rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
    text-decoration: none;
  }

  #sxc1-header > #sxc1-review-badge:hover,
  #sxc1-header > #sxc1-review-badge:focus-visible,
  #sxc1-header > #btn-ja-first:hover,
  #sxc1-header > #btn-ja-first:focus-visible,
  #sxc1-header > #btn-ui-lang:hover,
  #sxc1-header > #btn-ui-lang:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  #sxc1-header > #btn-ja-first[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--hover-bg);
    color: var(--accent);
  }

  /* -------------------------------------------------------------------
     Exercise index: collapsible chapters (native <details>, no JS).
     ------------------------------------------------------------------- */

  .ex-chapter-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    cursor: pointer;
    list-style: none;
    /* M5 a11y sweep: the chapter disclosure is the training index's
       primary action -- measured ~38px tall; raise it to the 44px
       tap-target floor. */
    min-height: 44px;
  }

  .ex-chapter-title::-webkit-details-marker {
    display: none;
  }

  .ex-chapter-title::before {
    content: "\25B8";
    flex: 0 0 auto;
    margin-right: 0.3rem;
    color: var(--muted);
    transition: transform 0.12s ease;
  }

  .ex-chapter[open] > .ex-chapter-title::before {
    transform: rotate(90deg);
  }

  .ex-chapter-title:hover,
  .ex-chapter-title:focus-visible {
    color: var(--accent);
  }

  .chapter-progress {
    flex: 0 0 auto;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .ex-chapter[open] > .ex-deck-list {
    margin-top: 1rem;
  }

  /* -------------------------------------------------------------------
     Deck cards: tier badge, completion count, prerequisites -- shared by
     the index's .ex-deck-card and each deck page's own single info block
     (both also carry .deck-card[data-tier], see "View.Progress").
     ------------------------------------------------------------------- */

  .deck-card {
    display: flex;
  }

  a.deck-card {
    flex-direction: column;
  }

  #sxc1-deck > .deck-card {
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin: 0 0 1.5rem;
  }

  .tier-badge {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    width: fit-content;
  }

  .tier-intro { background: var(--success-bg); color: var(--success); }
  .tier-core { background: var(--kind-quiz-bg); color: var(--kind-quiz); }
  .tier-stretch { background: var(--kind-lookup-bg); color: var(--kind-lookup); }

  .deck-progress {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .deck-requires {
    font-size: 0.78rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  /* -------------------------------------------------------------------
     Home page additions: review queue, continue, streak, retired note,
     corrupt banner, export/import/wipe.
     ------------------------------------------------------------------- */

  #sxc1-home > section:not(#sxc1-primary-training) {
    margin: 1.25rem 0 0;
  }

  #sxc1-review-queue,
  #sxc1-continue,
  #sxc1-progress-tools {
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
  }

  #sxc1-streak,
  #sxc1-retired-note {
    margin: 1.25rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .queue-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .queue-item a {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem;
    min-height: 44px;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    color: var(--text);
    text-decoration: none;
  }

  .queue-item a:hover,
  .queue-item a:focus-visible {
    border-color: var(--accent);
    background: var(--hover-bg);
  }

  .queue-deck {
    color: var(--muted);
    font-size: 0.82rem;
  }

  .queue-ex {
    font-weight: 700;
  }

  .queue-due {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 0.8rem;
    color: var(--danger);
  }

  #sxc1-continue > a {
    display: block;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }

  #sxc1-progress-banner,
  .progress-banner {
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--danger);
    border-radius: 0.75rem;
    background: var(--incorrect-bg);
    color: var(--text);
  }

  .progress-banner p {
    margin: 0 0 0.6rem;
  }

  .progress-banner p:last-child {
    margin-bottom: 0;
  }

  #sxc1-progress-tools h2 {
    margin: 0 0 0.9rem;
    font-size: 1.05rem;
  }

  .progress-flow {

  .progress-flow > summary {

    padding: 0.7rem 0.9rem;

    font-weight: 700;
    cursor: pointer;
  }

  .progress-flow[open] > summary {
    border-bottom: 1px solid var(--border);
  }

  .progress-flow > :not(summary) {
    margin-left: 0.9rem;
    margin-right: 0.9rem;
  }

  #sxc1-progress-tools button,
  .progress-file-actions > button,
  #btn-progress-import {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.6rem 1.1rem;
    margin: 0 0 0.9rem;
    border: 1px solid var(--accent);
    border-radius: 0.6rem;
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 700;
    cursor: pointer;
  }

  .progress-backup-hint,
  #sxc1-backup-status {
    margin: 0 0 0.75rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .progress-file-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }

  .progress-file-actions > button {
    margin: 0;
  }

  .progress-file-actions > button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  #sxc1-import-file {
    display: block;
    width: 100%;
    margin: 0 0 0.9rem;
    padding: 0.55rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--bg);
    color: var(--text);
  }

  #sxc1-progress-tools #btn-progress-wipe {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }

  #sxc1-progress-tools #btn-progress-wipe-confirm {
    background: var(--danger);
    color: var(--accent-contrast);
    border-color: var(--danger);
  }

  #sxc1-export-blob,
  #sxc1-import-input,
  #sxc1-corrupt-raw {
    display: block;

    min-height: 6rem;
    margin: 0 0 0.9rem;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    background: var(--bg);
    color: var(--text);

  #sxc1-import-form label {

    font-size: 0.9rem;

  #sxc1-import-preview {
