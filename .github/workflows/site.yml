name: site

# Build and verify the SXC-1 Trainer static site on every push/PR, and
# publish it to GitHub Pages on pushes to main. See scripts/build-site.sh
# and scripts/check-site.sh for the underlying build/verify story - this
# workflow only calls them, it does not reimplement them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Workflow-scope permissions are the minimum common to every job
# (checkout). The deploy job alone elevates to pages:write/id-token:write
# below -- the build job, which executes repository-controlled shell
# scripts on pull_request, never holds deployment or OIDC permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Per-ref build group: superseded PRs cancel their own in-flight build,
    # but a main build is never cancelled mid-flight by an unrelated PR or
    # manual run. This is a separate group from the deploy job's `pages`
    # group below, so an expensive build is never queued behind Pages'
    # single-pending-run semantics.
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The env context does not expose runner-process variables like
      # ImageOS/ImageVersion -- only variables explicitly set in this
      # workflow/job/step or written to $GITHUB_ENV. See:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#env-context
      # So the runner image identity has to be composed from the process
      # environment in a run step and published as a step output, which the
      # expression context CAN read.
      - name: Identify runner image
        id: runner-image
        run: |
          id="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "Runner image identity: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Cache the GHC WebAssembly toolchain. This tree is immutable, not
      # incrementally reusable, so there is deliberately no fallback
      # restore-key: a partial match (e.g. after a pin bump, or a runner image
      # migration) is never desirable -- it would restore a toolchain that
      # does not match the pin and, worse, get re-saved under the new key,
      # poisoning the cache. The key covers OS, arch, the runner image
      # (from the `runner-image` step output above -- see the comment on
      # that step for why the env context cannot be used here) and the
      # installer script itself, so any of those changing forces a fresh
      # install. install-toolchain.sh runs unconditionally below (no
      # `if: cache-hit != 'true'`): it is
      # idempotent and now self-heals a stale/mismatched restore via a
      # strict stamp check instead of trusting cache-hit.
      #
      # restore-keys IS FORBIDDEN on THIS cache (M0 finding M3): a broad
      # restore-key here previously let a stale toolchain be certified
      # fresh, because install-toolchain.sh's health check accepted any
      # working compiler regardless of pin -- see briefs/M0-codex-findings.json
      # finding M3. It is permitted (and, as of
      # briefs/M2-signoff-fixes.json task "quiz-selection-semantics" FIX 4,
      # restored) on the CABAL dist-newstyle cache below, which has no
      # equivalent lying health check of its own -- see that cache step's
      # comment for why the two differ.
      # ----------------------------------------------------------------
      - name: Cache GHC WebAssembly toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/install-toolchain.sh') }}

      - name: Install GHC WebAssembly toolchain
        timeout-minutes: 60
        run: ./scripts/install-toolchain.sh

      # ----------------------------------------------------------------
      # Cache cabal's incremental build directory so warm builds (e.g. a
      # cache hit above, or a re-run with nothing relevant changed) don't
      # recompile miso and its dependency closure from scratch every run.
      #
      # restore-keys IS permitted here (unlike the TOOLCHAIN cache above,
      # where it is forbidden -- M0 finding M3: a broad toolchain
      # restore-key let a stale compiler be certified fresh, because
      # install-toolchain.sh's health check accepted any working
      # wasm32-wasi-ghc regardless of pin). A brief M2-signoff-fixes
      # revision of this step removed the fallback and asserted zero
      # whole-file `restore-keys` occurrences across the ENTIRE workflow --
      # that assertion was overbroad and wrong (briefs/M2-signoff-fixes.json,
      # task "quiz-selection-semantics", FIX 4): M0 M3 is specifically
      # about the toolchain's own lying health check, which this cache has
      # no equivalent of. A restore-keys HIT here can only ever be a
      # PARTIAL match (an older site/src, an older translations/*.md, ...
      # than the commit under test) that is never trusted blindly: GHC's
      # own recompilation checking is content-based (it recompiles
      # whatever the restored tree's object hashes say is stale, exactly
      # as it would on any developer's warm local rebuild), M1 already
      # hashes site/src and site/test into the key below, addDependentFile
      # covers translations and content at compile time, and
      # scripts/check-site.sh's checks 11/12/15-17 (three-way stats
      # agreement, exact-bytes source integrity, and the exercise-stats
      # agreement/fixture checks) independently catch any residual
      # staleness BEHAVIOURALLY, after the fact, the same way they would
      # catch a developer's own forgotten rebuild. Removing the fallback
      # bought no additional safety and cost a full miso + library rebuild
      # from scratch on every source change in CI. See the exact-key-only
      # TOOLCHAIN cache comment above for why THAT cache is different: it
      # has no content-based staleness check of its own to fall back on,
      # so a partial hit there is trusted uncritically by
      # install-toolchain.sh's own (too-loose) health check -- this cache
      # is never trusted uncritically by anything, cabal always re-verifies.
      #
      # The key (and the restore-keys prefix) hashes site/cabal.project,
      # site/sxc1-trainer.cabal, site/app/**, site/src/**, site/test/** and
      # translations/*.md. That last one is load-bearing, not decorative:
      # translations/*.md is embedded into the wasm at COMPILE TIME by
      # Template Haskell (SXC1.Content.Embed, via `extra-source-files:
      # ../translations/*.md` in site/sxc1-trainer.cabal) and reparsed at
      # runtime from that embedded copy -- the app never fetches the
      # markdown at runtime. If a translation edit didn't appear in this
      # key, an exact-key hit would report "up to date" and CI would
      # happily build, verify and deploy wasm containing the OLD
      # translation text -- hashing the sources is enough to invalidate on
      # code changes; the content needs the same treatment because it also
      # flows into the compiled artifact. The restore-keys prefix below
      # (everything up to and including the trailing '-') is deliberately
      # coarser than the exact key so a partial match is still possible on
      # a miss; a full rebuild triggered by cabal's own staleness check on
      # a restored partial match is slower than a hit, never wrong.
      # ----------------------------------------------------------------
      - name: Cache cabal build directory
        uses: actions/cache@v6
        with:
          path: site/dist-newstyle
          key: dist-newstyle-${{ runner.os }}-${{ hashFiles('site/cabal.project', 'site/sxc1-trainer.cabal', 'site/app/**', 'site/src/**', 'site/test/**', 'translations/*.md') }}
          restore-keys: |
            dist-newstyle-${{ runner.os }}-

      # ----------------------------------------------------------------
      # No separate image-rendering step: the 108 WebP page images the
      # reader's "show original page (JA)" panel uses are committed under
      # site/static/pages/<slug>/page-NN.webp and copied verbatim into
      # site/public/ by build-site.sh's `cp -R site/static/. site/public/`
      # (build-site.sh itself is unmodified for M1 -- it already did this
      # copy for M0's static shell). CI installs no PDF/image tooling and
      # runs no rendering step; the bytes reviewed in git are the bytes
      # served. To regenerate the images by hand after a source PDF
      # changes, run ./scripts/render-page-images.sh locally (it needs
      # poppler-utils and either cwebp or python3-pil, neither of which
      # this workflow installs) and commit the result.
      #
      # site/public ends up about 12.8 MB (currently ~3.3 MB app.wasm +
      # ~49 KB ghc_wasm_jsffi.js from the OPTIMIZED build below, plus
      # ~9.4 MB of committed page images) -- well inside GitHub Pages'
      # 1 GB artifact limit.
      #
      # --optimize (M3 "Size ruling", PLAN.md, coordinator, 2026-08-07;
      # wired here by task "docs-and-ci"): THE SHIPPING ARTIFACT IS THE
      # wasm-opt BUILD. The full 52-deck/435-exercise course does not fit
      # under check-site.sh's WASM_GZIP_CEILING_BYTES=1000000 unoptimized
      # -- measured on this tree, the plain default build gzips app.wasm
      # to roughly 1,094,000-1,097,000 bytes (OVER the ceiling; run
      # without --optimize locally and check-site.sh's size check will
      # fail on exactly this). `wasm-opt -all -O2` + `wasm-tools strip`
      # (build-site.sh's OWN --optimize flag, unmodified by this
      # workflow -- see scripts/build-site.sh) brings that down to
      # roughly 907,600-908,000 bytes, comfortably under budget, and
      # could not be made to miscompile under adversarial testing
      # (byte-identical exe:*-check self-test output either way; every
      # headless-browser assertion this project runs green, repeatedly,
      # against the optimized artifact -- see scripts/check-site.sh's own
      # WASM_GZIP_CEILING_BYTES comment and its `--optimized` flag, which
      # reproduces this exact pipeline on demand for local verification).
      #
      # build-site.sh's OWN default stays unoptimized (OPTIMIZE=0 there,
      # unchanged) -- a bare local `./scripts/build-site.sh` is still the
      # fast, deliberately-unoptimized default for iteration (see
      # README.md's Build quickstart). ONLY this workflow's own
      # invocation opts in, because CI's build is what actually gets
      # verified and (once ENABLE_PAGES is re-enabled -- see the deploy
      # job below and README.md's Deployment section) shipped: the
      # artifact "Verify site" checks and "Upload Pages artifact"
      # publishes two steps down has to be the one that fits the
      # ceiling, not merely the one that was fastest to produce locally.
      # check-site.sh's own size check and size ledger measure whatever
      # is ACTUALLY at site/public/app.wasm, regardless of which flavour
      # produced it -- so this one flag is the only change needed to make
      # that artifact the optimized one; check-site.sh itself is
      # untouched, and so is its WASM_GZIP_CEILING_BYTES constant.
      # ----------------------------------------------------------------
      - name: Build site
        timeout-minutes: 30
        run: ./scripts/build-site.sh --optimize

      # ----------------------------------------------------------------
      # M2: run the exercise-content validator directly, as its own named,
      # timed step, BEFORE the full check-site.sh verification below. This
      # is deliberately redundant with check-site.sh (which runs
      # exe:exercise-check itself as part of its own content-axis checks
      # 15-17 -- see scripts/check-site.sh) -- the unskippable gate stays
      # check-site.sh's `result=complete` assertion two steps down, this
      # step does not replace or loosen it. The point of running it again
      # here, explicitly and first, is readability and speed: a content-only
      # pull request (a typo'd citation, a bad field, a missing fixture)
      # fails in seconds against a short, exercise-shaped error message,
      # instead of only surfacing after a full build + the ~1-minute
      # headless-browser sweep two steps below has already run.
      #
      # exe:exercise-check is built above by build-site.sh (it now builds
      # exe:app, exe:content-check AND exe:exercise-check), so this step
      # only needs to resolve and run the already-built binary -- same
      # `wasm32-wasi-cabal list-bin` / wasm-run.mjs convention used
      # throughout scripts/check-site.sh for exe:content-check and
      # exe:exercise-check alike. Every mode is required to exit 0:
      # --content-dir/--translations-dir against the real working tree,
      # --fixtures against the falsifiability corpus (content/fixtures),
      # and --self-test (the validator's own internal test suite).
      # ----------------------------------------------------------------
      - name: Validate exercise content
        timeout-minutes: 10
        run: |
          . "$HOME/.ghc-wasm/env"
          cd site
          BIN="$(wasm32-wasi-cabal list-bin exe:exercise-check | tail -n1)"
          echo "exercise-check binary: $BIN"
          wasm-run.mjs "$BIN" --content-dir "$GITHUB_WORKSPACE/content" --translations-dir "$GITHUB_WORKSPACE/translations"
          wasm-run.mjs "$BIN" --fixtures "$GITHUB_WORKSPACE/content/fixtures"
          wasm-run.mjs "$BIN" --self-test

      # ----------------------------------------------------------------
      # M3 (task "docs-and-ci"): run the progress-core and id-registry
      # checkers directly, as their own named, timed step, for the same
      # reason "Validate exercise content" above runs exe:exercise-check
      # early -- fast, readable feedback on the pure spaced-repetition
      # core or the PromptId-stability registry, in seconds, instead of
      # only surfacing inside the ~1-minute check-site.sh sweep below.
      #
      # DELIBERATELY REDUNDANT with check-site.sh, not a replacement for
      # it: check-site.sh already resolves and runs exe:progress-check
      # --self-test and exe:registry-check (--self-test AND, unlike
      # progress-check, a plain run against the real, committed
      # content/id-registry.tsv and the actual corpus) as part of its own
      # content-axis gate (see scripts/check-site.sh's "M3 harness item
      # 6" section) -- so a plain `check-site.sh` run alone already
      # covers both binaries; the unskippable gate stays check-site.sh's
      # `result=complete` assertion two steps down, and this step does
      # not replace or loosen it.
      #
      # exe:progress-check and exe:registry-check are built above by
      # build-site.sh (it now builds exe:app, exe:content-check,
      # exe:exercise-check, exe:progress-check AND exe:registry-check),
      # so this step only needs to resolve and run the already-built
      # binaries -- same `wasm32-wasi-cabal list-bin` / wasm-run.mjs
      # convention used throughout.
      # ----------------------------------------------------------------
      - name: Validate progress core and id registry
        timeout-minutes: 10
        run: |
          . "$HOME/.ghc-wasm/env"
          cd site
          PBIN="$(wasm32-wasi-cabal list-bin exe:progress-check | tail -n1)"
          echo "progress-check binary: $PBIN"
          wasm-run.mjs "$PBIN" --self-test
          RBIN="$(wasm32-wasi-cabal list-bin exe:registry-check | tail -n1)"
          echo "registry-check binary: $RBIN"
          wasm-run.mjs "$RBIN" --self-test
          wasm-run.mjs "$RBIN"

      # check-site.sh needs no new CI step for M1: the content checker
      # (exe:content-check under wasm-run.mjs), the three-way content
      # agreement check, the exact-bytes source-integrity check, the
      # deepened page-image checks and the app.wasm size tripwire are all
      # checks already inside check-site.sh (read it -- checks 9-13),
      # which this step already ran on M0. The generous timeout below is
      # sized for the browser axis, which now visits all 108 page routes
      # in their /ja form (real image decode) twice per route (once at the
      # origin root, once at a GitHub-Pages-style sub-path) instead of M0's
      # single counter page.
      #
      # NEW7 (M1 gate round 3, M0 regression fix): asserting the
      # result=complete marker alone is no longer sufficient by itself --
      # it never was airtight against a *hypothetical* bug in check-site.sh's
      # own marker logic, and round 3 showed exactly that class of gap can
      # go unnoticed for a full milestone. So this step now asserts BOTH
      # independently: (1) result=complete is printed, AND (2) the summary
      # line does not carry a "(N skipped)" suffix, i.e. SKIPPED is
      # actually 0 by check-site.sh's own accounting, not merely by its
      # marker's say-so. Either one alone is exactly the can't-fail shape
      # this gate round was lost to; both together is not.
      - name: Verify site
        timeout-minutes: 30
        run: |
          ./scripts/check-site.sh | tee /tmp/check-site.log
          grep -q 'check-site: result=complete' /tmp/check-site.log \
            || { echo "::error::browser verification did not run (no result=complete marker) -- a silently skipped axis is a CI failure"; exit 1; }
          if grep -qE '\([1-9][0-9]* skipped\)' /tmp/check-site.log; then
            echo "::error::check-site.sh skipped one or more checks even though result=complete was printed -- NEW7 guard tripped, this should be impossible"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

      # M3 (task "docs-and-ci"): this step used to opt its own outcome out
      # of the job result (present since M0). That opt-out changed
      # nothing about whether this step COULD gate anything -- `if:
      # failure()` means it only ever runs after an earlier, real step in
      # this job has already failed, and it is the last step in the job,
      # so there is nothing after it to skip -- but task "docs-and-ci"
      # carries its own verify command asserting that no step anywhere in
      # this directory opts out that way, stricter than any prior
      # milestone's, so it is cleaned up here too. Removing the opt-out
      # cannot un-gate anything: the job's pass/fail outcome was always decided
      # by the earlier failing step, never by whether this best-effort
      # debug-artifact upload itself succeeded.
      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-debug
          path: |
            site/public
            site/dist-newstyle/**/*.log

  # ----------------------------------------------------------------------
  # This job stays inert until the repository variable ENABLE_PAGES is
  # explicitly set to 'true'. The GitHub repository does not exist yet:
  # its name and visibility are still open with the owner (PLAN.md open
  # question 1), and GitHub Pages requires a public repo on a free
  # account. Gating on an explicit opt-in variable (rather than assuming
  # Pages is configured) is safe under either outcome and needs no code
  # change when the decision lands -- unset (the default) means the job
  # is skipped and `main` stays green; once the owner makes the repo
  # public, enables Pages with the GitHub Actions source, and sets
  # ENABLE_PAGES=true as a repository variable, pushes to main deploy.
  # ----------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys share GitHub Pages' own single-pending-deployment semantics:
    # a queued deploy for a newer main commit supersedes an older pending
    # one, but a deploy is never cancelled once it has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
